<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Skills to evidence map</title><desc id="desc">Maps runtime and platform skills to production, upstream, and systems-lab evidence.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#86f7ff;font-size:18px;font-weight:700}.t{fill:#c8dbe1;font-size:12px}.m{fill:#5f7d86;font-size:10px}.ok{fill:#70f0b1}.cyan{fill:#7ee7ff}.warn{fill:#ffd166}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.3}.line{stroke:#245f6e;stroke-width:1.4}</style><rect width="1200" height="470" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="42" class="h">SKILLS → EVIDENCE MAP</text><text x="32" y="68" class="m">NOT A KEYWORD WALL // EACH LANE IS TIED TO A REAL ENGINEERING SURFACE</text><g transform="translate(35 105)"><rect class="box" width="225" height="82" rx="8"/><text x="18" y="25" class="ok">JVM / BACKEND CORE</text><text x="18" y="50" class="t">Java · Spring · REST · JPA</text><text x="18" y="69" class="m">PROD + OSS + SYSTEMS LAB</text><rect class="box" x="285" width="225" height="82" rx="8"/><text x="303" y="25" class="cyan">PYTHON SERVICES</text><text x="303" y="50" class="t">Python · FastAPI · Flask</text><text x="303" y="69" class="m">PROFESSIONAL BACKEND / INTEGRATION</text><rect class="box" x="570" width="250" height="82" rx="8"/><text x="588" y="25" class="cyan">WEB / INTEGRATION</text><text x="588" y="50" class="t">Node · TS · JS · ReactJS</text><text x="588" y="69" class="m">PROFESSIONAL DELIVERY / JOB FEED</text><rect class="box" x="880" width="250" height="82" rx="8"/><text x="898" y="25" class="cyan">NATIVE / PERFORMANCE</text><text x="898" y="50" class="t">C++ · STL · JNI · CUDA</text><text x="898" y="69" class="m">PROD C++ + VORTEX LAB</text></g><g transform="translate(35 225)"><rect class="box" width="340" height="94" rx="8"/><text x="18" y="25" class="ok">DISTRIBUTED / MESSAGING</text><text x="18" y="51" class="t">Kafka · queues · async · idempotency</text><text x="18" y="72" class="m">production workflows + AutoMQ / Fluss work</text><rect class="box" x="395" width="340" height="94" rx="8"/><text x="413" y="25" class="ok">STATE / DATA</text><text x="413" y="51" class="t">MySQL · PostgreSQL · MongoDB · Redis</text><text x="413" y="72" class="m">SQL tuning · caching · MVCC / txn lab</text><rect class="box" x="755" width="375" height="94" rx="8"/><text x="773" y="25" class="ok">PLATFORM / OPERABILITY</text><text x="773" y="51" class="t">AWS · EKS · Docker · K8s · Jenkins</text><text x="773" y="72" class="m">CloudWatch · Splunk · Dynatrace · CI/CD</text></g><g transform="translate(35 355)"><text x="0" y="0" class="m">EVIDENCE LEGEND</text><text x="130" y="0" class="ok">● PRODUCTION / EXTERNAL</text><text x="355" y="0" class="cyan">● PROFESSIONAL / REPRODUCIBLE</text><text x="650" y="0" class="warn">● REVIEW / DESIGN-IN-PROGRESS</text><path d="M0 26H1130" class="line"/><circle r="4" fill="#7ee7ff"><animateMotion dur="6.5s" repeatCount="indefinite" path="M0 26H1130"/></circle><text x="0" y="58" class="m">PRIMARY DEPTH // JAVA + DISTRIBUTED SYSTEMS. OTHER RUNTIMES EXTEND DELIVERY SURFACE WITHOUT PRETENDING EQUAL OSS DEPTH.</text></g></svg>