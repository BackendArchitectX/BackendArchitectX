<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Pranay Kadu — prompt identity terminal</title>
<desc id="desc">Minimal black and green Linux terminal hero built around a large greater-than underscore prompt mark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020402"/>
    <stop offset="0.55" stop-color="#050805"/>
    <stop offset="1" stop-color="#010201"/>
  </linearGradient>
  <radialGradient id="aura" cx="30%" cy="48%" r="55%">
    <stop offset="0" stop-color="#39FF14" stop-opacity="0.18"/>
    <stop offset="0.45" stop-color="#39FF14" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#39FF14" opacity="0.026"/>
  </pattern>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#39FF14" stroke-opacity="0.025" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>
<rect width="1200" height="430" rx="24" fill="url(#aura)"/>
<rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#39FF14" stroke-opacity="0.30"/>

<g transform="translate(58 84)" filter="url(#glow)" stroke="#39FF14" fill="none" stroke-linecap="square" stroke-linejoin="miter">
  <path d="M0 0 L132 104 L0 208" stroke-width="26"/>
  <path d="M192 208 H372" stroke-width="26"/>
  <rect x="386" y="186" width="24" height="30" fill="#7CFF4F" stroke="none">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.48;.92;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="512" y="74" fill="#6e9a6b" font-size="14" letter-spacing="2">TTY0 / LINUX / BACKENDARCHITECTX</text>
  <text x="512" y="132" fill="#39FF14" font-size="18" font-weight="700">&gt;_ whoami</text>
  <text x="512" y="182" fill="#F2FFF0" font-size="46" font-weight="800">PRANAY KADU</text>
  <text x="512" y="220" fill="#7CFF4F" font-size="20" font-weight="700">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>
  <text x="512" y="270" fill="#39FF14" font-size="18" font-weight="700">&gt;_ stack --primary</text>
  <text x="512" y="308" fill="#D9FFD8" font-size="21" font-weight="700">JAVA · SPRING BOOT · KAFKA · REDIS · SQL</text>
  <text x="512" y="340" fill="#B7E8B5" font-size="17">KUBERNETES · AWS · PYTHON · TYPESCRIPT · C++</text>
  <text x="512" y="386" fill="#39FF14" font-size="17">&gt;_ <tspan fill="#D9FFD8">observe → isolate → model → prove → operate</tspan></text>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#39FF14" font-size="11" opacity="0.08">
  <text x="54" y="34">&gt;_ java -jar service.jar</text>
  <text x="880" y="34">&gt;_ git status --short</text>
  <text x="910" y="62">&gt;_ journalctl -f</text>
  <text x="930" y="92">&gt;_ kubectl get pods</text>
  <text x="905" y="122">&gt;_ redis-cli ping</text>
  <text x="950" y="152">&gt;_ ss -lntp</text>
</g>

<rect width="1200" height="430" rx="24" fill="url(#scan)"/>
<rect width="1200" height="430" rx="24" fill="#39FF14" opacity="0">
  <animate attributeName="opacity" values="0;0;.015;0;0;.01;0" dur="5.2s" repeatCount="indefinite"/>
</rect>
</svg>