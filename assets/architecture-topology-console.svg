<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.t{fill:#c8dbe1;font-size:12px}.m{fill:#597b86;font-size:10px}.ok{fill:#70f0b1}.warn{fill:#ffd166}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.4}.line{stroke:#235663;stroke-width:2}.pulse{fill:#7ee7ff;filter:url(#g)}</style><defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="610" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">CAPABILITY TOPOLOGY // MULTI-RUNTIME BACKEND DELIVERY</text><text x="32" y="68" class="m">RESUME-GROUNDED LAYERS // CLIENT → API → JVM/PYTHON/NODE → STREAM/STATE → CLOUD/OBSERVABILITY</text>
