<g transform="translate(35 500)"><text class="warn" x="0" y="0">POSITIONING</text><text class="t" x="105" y="0">Java/JVM owns the profile center of gravity; Python, JS/TS, React and C++ widen delivery range without flattening depth.</text><path class="line" d="M0 28H1130"/><circle r="4" class="pulse"><animateMotion dur="6s" repeatCount="indefinite" path="M0 28H1130"/></circle><text class="m" x="0" y="58">SYSTEM RULE // choose the runtime for the boundary: core correctness, integration velocity, client delivery, or native performance.</text></g><text x="35" y="586" class="m">SOURCE MODEL // SKILLS AND EXPERIENCE MAPPED FROM CURRENT RESUME; THIS DIAGRAM REPRESENTS CAPABILITY LAYERS, NOT ONE CLAIMED SINGLE DEPLOYMENT TOPOLOGY</text></svg>