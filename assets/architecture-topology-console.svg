<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.t{fill:#c8dbe1;font-size:12px}.m{fill:#597b86;font-size:10px}.ok{fill:#70f0b1}.warn{fill:#ffd166}.bad{fill:#ff667d}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.4}.line{stroke:#235663;stroke-width:2}.pulse{fill:#7ee7ff;filter:url(#g)}</style><defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">SYSTEM TOPOLOGY // FAILURE-AWARE BACKEND PATH</text><text x="32" y="68" class="m">LOGICAL FLOW / OWNERSHIP / FALLBACK / OBSERVABILITY / DURABLE STATE</text><g transform="translate(35 110)"><rect class="box" x="0" y="0" width="150" height="70" rx="8"/><text x="24" y="28" class="m">INGRESS</text><text x="24" y="52" class="t">API GATEWAY</text><rect class="box" x="220" y="0" width="160" height="70" rx="8"/><text x="244" y="28" class="m">POLICY</text><text x="244" y="52" class="t">AUTH / LIMIT</text><rect class="box" x="450" y="0" width="170" height="70" rx="8"/><text x="474" y="28" class="m">COMPUTE</text><text x="474" y="52" class="t">JAVA SERVICE</text><rect class="box" x="690" y="0" width="160" height="70" rx="8"/><text x="714" y="28" class="m">STATE</text><text x="714" y="52" class="t">REDIS HOT PATH</text><rect class="box" x="920" y="0" width="180" height="70" rx="8"/><text x="944" y="28" class="m">DURABLE</text><text x="944" y="52" class="t">SQL / STORAGE</text><path class="line" d="M150 35H220M380 35H450M620 35H690M850 35H920"/><circle r="5" class="pulse"><animateMotion dur="5s" repeatCount="indefinite" path="M150 35H920"/></circle>
<rect class="box" x="450" y="145" width="170" height="70" rx="8"/><text x="474" y="173" class="m">STREAM</text><text x="474" y="197" class="t">KAFKA / EVENTS</text><path d="M535 70V145" class="line"/><circle r="4" class="pulse"><animateMotion dur="2.3s" repeatCount="indefinite" path="M535 70V145"/></circle><rect class="box" x="690" y="145" width="160" height="70" rx="8"/><text x="714" y="173" class="m">REMOTE</text><text x="714" y="197" class="t">RISK PROVIDER</text><path d="M620 35H770V145" class="line"/><text x="860" y="178" class="warn">CB / TIMEOUT / FALLBACK</text>
<rect class="box" x="0" y="285" width="265" height="78" rx="8"/><text x="24" y="313" class="m">OBSERVE</text><text x="24" y="339" class="t">LOGS / METRICS / TRACES / JFR</text><rect class="box" x="345" y="285" width="250" height="78" rx="8"/><text x="369" y="313" class="m">SCALE</text><text x="369" y="339" class="t">K8S / HPA / CI-CD</text><rect class="box" x="675" y="285" width="425" height="78" rx="8"/><text x="699" y="313" class="m">FAILURE CONTRACT</text><text x="699" y="339" class="t">OWN → CONTAIN → RELEASE → FINALIZE → PROVE</text><path d="M535 215V285" class="line"/><circle r="4" class="pulse"><animateMotion dur="2.8s" repeatCount="indefinite" path="M535 215V285"/></circle><circle cx="1055" cy="318" r="6" class="ok"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle></g><text x="35" y="490" class="m">OPERATING INVARIANT // every asynchronous resource, state transition and remote dependency must have an owner and a failure path</text></svg>