<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">BackendArchitectX upstream and systems terminal pane</title><desc id="desc">A tmux-like split view for open-source contributions and original systems projects.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061008"/><stop offset="1" stop-color="#020503"/></linearGradient><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#39FF14" opacity=".02"/></pattern><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="520" rx="18" fill="#010301"/><rect x="1" y="1" width="1198" height="518" rx="17" fill="none" stroke="#39FF14" stroke-opacity=".38"/><rect width="1200" height="36" rx="18" fill="#0a100b"/><rect y="22" width="1200" height="14" fill="#0a100b"/><text x="18" y="24" fill="#a9baa9" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">upstream.git   |   ~/systems   |   journalctl -f</text>
<rect y="36" width="1200" height="454" fill="url(#bg)"/><line x1="600" y1="36" x2="600" y2="490" stroke="#234026"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<text x="28" y="72" fill="#39FF14" font-size="15" font-weight="700">$ git log --oneline --decorate upstream</text>
<text x="28" y="112" fill="#B6FF00" font-size="14" font-weight="700">● MERGED</text><text x="132" y="112" fill="#eefcee" font-size="14">AutoMQ #3493</text>
<text x="132" y="134" fill="#789879" font-size="12">controller-only reporter lifecycle</text>
<text x="28" y="176" fill="#7CFF4F" font-size="14">○ REVIEW</text><text x="132" y="176" fill="#eefcee" font-size="14">Trino #30973</text>
<text x="132" y="198" fill="#789879" font-size="12">commit / failure finalization ownership</text>
<text x="28" y="240" fill="#7CFF4F" font-size="14">○ REVIEW</text><text x="132" y="240" fill="#eefcee" font-size="14">Fluss #4263</text>
<text x="132" y="262" fill="#789879" font-size="12">logical UID / physical endpoint identity</text>
<text x="28" y="304" fill="#7CFF4F" font-size="14">○ REVIEW</text><text x="132" y="304" fill="#eefcee" font-size="14">AutoMQ #3579</text>
<text x="132" y="326" fill="#789879" font-size="12">Prometheus authentication lifecycle</text>
<text x="28" y="368" fill="#7CFF4F" font-size="14">○ REVIEW</text><text x="132" y="368" fill="#eefcee" font-size="14">Fluss #4230</text>
<text x="132" y="390" fill="#789879" font-size="12">Paimon metadata path mapping</text>
<text x="28" y="442" fill="#39FF14" font-size="13">$ git status <tspan fill="#B6FF00">clean</tspan></text>

<text x="628" y="72" fill="#39FF14" font-size="15" font-weight="700">$ tree ~/systems -L 2</text>
<text x="628" y="111" fill="#eefcee" font-size="18" font-weight="700">~/systems</text>
<text x="646" y="148" fill="#7CFF4F" font-size="17" font-weight="700">├── Vortex-CUDA</text>
<text x="674" y="180" fill="#d9ebd9" font-size="14">│   Spring Boot → Java → JNI → CUDA → GPU Top-K</text>
<text x="674" y="208" fill="#7f9b80" font-size="13">│   v1.0.0 · 48/48 benchmark cases · M18 smoke</text>
<text x="646" y="260" fill="#7CFF4F" font-size="17" font-weight="700">└── distrib-txn-db</text>
<text x="674" y="292" fill="#d9ebd9" font-size="14">    HLC → MVCC → intents → uncertainty → restart</text>
<text x="674" y="320" fill="#7f9b80" font-size="13">    serializable conflict prevention / teaching model</text>
<text x="628" y="372" fill="#39FF14" font-size="14">$ journalctl -n 3 --no-pager</text>
<text x="628" y="404" fill="#789879" font-size="12">[kernel] lifecycle ownership verified</text>
<text x="628" y="428" fill="#789879" font-size="12">[runtime] deterministic race coverage enabled</text>
<text x="628" y="452" fill="#B6FF00" font-size="12">[system] proof &gt; presentation</text>
</g>
<rect y="490" width="1200" height="30" fill="#0b160d"/><rect y="490" width="280" height="30" fill="#17371b"/><text x="14" y="510" fill="#B6FF00" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2:upstream+systems*</text><text x="1037" y="510" fill="#668067" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pane 2/3</text><rect width="1200" height="520" rx="18" fill="url(#scan)"/>
</svg>