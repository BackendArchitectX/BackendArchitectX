<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="bx-title bx-description">
  <title id="bx-title">Pranay Kadu — BX systems robot</title>
  <desc id="bx-description">BackendArchitectX. Backend Software Engineer: Java, Spring Boot, Distributed Systems and AWS. An angular robot with a terminal visor and a BX monogram unfolds its own panels into API, Kafka, Redis and SQL nodes. A request moves through the illustrative backend, then the nodes fold back into the robot. The background remains transparent and colors adapt to the page theme.</desc>
  <defs>
    <clipPath id="command-clip"><rect class="motion typing-clip" x="79" y="325" width="535" height="39"/></clipPath>
    <linearGradient id="bx-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--facet)"/><stop offset="1" stop-color="var(--surface)"/></linearGradient>
  </defs>
  <style>
  :root {
    --ink:#e6edf3; --muted:#9da7b4; --edge:#414b57; --surface:#18212c;
    --accent:#e8ba8c; --strong:#f4d0a7; --mint:#a6e4c5; --facet:#293644;
  }
  text { font-family:'Segoe UI',Arial,sans-serif; fill:var(--ink); }
  .mono { font-family:'DejaVu Sans Mono','Liberation Mono',Consolas,monospace; }
  .brand,.edition { font-size:16px; fill:var(--muted); letter-spacing:.8px; }
  .kicker { font-size:15px; fill:var(--accent); letter-spacing:1.9px; }
  .name { font-size:68px; font-weight:500; letter-spacing:-2.1px; }
  .role { font-size:23px; }
  .stack { font-size:19px; fill:var(--muted); }
  .mobile-stack { display:none; }
  .footer { font-size:16px; fill:var(--muted); }
  .terminal-title { font-size:15px; fill:var(--muted); }
  .command { font-size:20px; }
  .output { font-size:16px; fill:var(--muted); }
  .prompt { fill:var(--accent); }
  .ready { font-size:16px; fill:var(--mint); }
  .phase-build { opacity:1; animation:phase-build 6.4s steps(1,end) infinite; }
  .phase-route { opacity:0; animation:phase-route 6.4s steps(1,end) infinite; }
  .phase-fold { opacity:0; animation:phase-fold 6.4s steps(1,end) infinite; }
  .typing-clip { animation:type-command 2.133333s linear infinite; }
  .cursor { animation:cursor .8s steps(1,end) infinite; }
  .head-pod { animation:head-pod 6.4s cubic-bezier(.4,0,.2,1) infinite; }
  .arm-api { animation:arm-api 6.4s cubic-bezier(.4,0,.2,1) infinite; }
  .arm-kafka { animation:arm-kafka 6.4s cubic-bezier(.4,0,.2,1) infinite; }
  .boot-redis { animation:boot-redis 6.4s cubic-bezier(.4,0,.2,1) infinite; }
  .boot-sql { animation:boot-sql 6.4s cubic-bezier(.4,0,.2,1) infinite; }
  .node-label,.system-traces,.core-label { opacity:0; animation:system-view 6.4s ease-in-out infinite; }
  .mechanical-mark { opacity:1; animation:mechanical-view 6.4s ease-in-out infinite; }
  .node-label { font-size:15px; fill:var(--ink); text-anchor:middle; }
  .boot-label { font-size:13px; }
  .core-label { font-size:16px; fill:var(--muted); text-anchor:middle; letter-spacing:.7px; }
  .flow-in { opacity:0; animation:flow-in 6.4s linear infinite; }
  .flow-cache { opacity:0; animation:flow-cache 6.4s linear infinite; }
  .flow-data { opacity:0; animation:flow-data 6.4s linear infinite; }
  .flow-event { opacity:0; animation:flow-event 6.4s linear infinite; }
  .visor-caret { animation:cursor .65s steps(1,end) infinite; }
  .core-ring { transform-origin:0 0; animation:core-ring 6.4s ease-in-out infinite; }
  .story-label { font-size:15px; letter-spacing:2.5px; fill:var(--muted); text-anchor:middle; }
  @keyframes phase-build { 0%,33.32% {opacity:1} 33.33%,100% {opacity:0} }
  @keyframes phase-route { 0%,33.32% {opacity:0} 33.33%,66.65% {opacity:1} 66.66%,100% {opacity:0} }
  @keyframes phase-fold { 0%,66.65% {opacity:0} 66.66%,100% {opacity:1} }
  @keyframes type-command { 0% {width:0px} 23%,100% {width:535px} }
  @keyframes cursor { 0%,49% {opacity:1} 50%,100% {opacity:0} }
  @keyframes head-pod {
    0%,18%,92%,100% {transform:translate(0px,-104px) rotate(-3deg)}
    34%,74% {transform:translate(0px,-138px) rotate(0deg)}
  }
  @keyframes arm-api {
    0%,18%,92%,100% {transform:translate(-88px,-24px) rotate(-9deg)}
    34%,74% {transform:translate(-150px,-64px) rotate(0deg) scale(1.24)}
  }
  @keyframes arm-kafka {
    0%,18%,92%,100% {transform:translate(88px,-24px) rotate(9deg)}
    34%,74% {transform:translate(150px,-64px) rotate(0deg) scale(1.24)}
  }
  @keyframes boot-redis {
    0%,18%,92%,100% {transform:translate(-30px,94px) rotate(-7deg)}
    34%,74% {transform:translate(-125px,111px) rotate(0deg) scale(1.65,1.18)}
  }
  @keyframes boot-sql {
    0%,18%,92%,100% {transform:translate(30px,94px) rotate(7deg)}
    34%,74% {transform:translate(125px,111px) rotate(0deg) scale(1.65,1.18)}
  }
  @keyframes system-view { 0%,27%,84%,100% {opacity:0} 35%,74% {opacity:1} }
  @keyframes mechanical-view { 0%,24%,88%,100% {opacity:1} 34%,77% {opacity:0} }
  @keyframes flow-in { 0%,35% {opacity:0;stroke-dashoffset:100} 36% {opacity:1} 44% {opacity:1;stroke-dashoffset:0} 45%,100% {opacity:0;stroke-dashoffset:0} }
  @keyframes flow-cache { 0%,44% {opacity:0;stroke-dashoffset:100} 45% {opacity:1} 53% {opacity:1;stroke-dashoffset:0} 54%,100% {opacity:0;stroke-dashoffset:0} }
  @keyframes flow-data { 0%,53% {opacity:0;stroke-dashoffset:100} 54% {opacity:1} 62% {opacity:1;stroke-dashoffset:0} 63%,100% {opacity:0;stroke-dashoffset:0} }
  @keyframes flow-event { 0%,62% {opacity:0;stroke-dashoffset:100} 63% {opacity:1} 71% {opacity:1;stroke-dashoffset:0} 72%,100% {opacity:0;stroke-dashoffset:0} }
  @keyframes core-ring { 0%,25%,85%,100% {opacity:.28;transform:scale(.94)} 40%,70% {opacity:.9;transform:scale(1)} }
  @media (prefers-color-scheme:light) {
    :root { --ink:#24292f; --muted:#59636e; --edge:#c5cdd6; --surface:#f0f3f6; --accent:#8e531c; --strong:#9b5a1d; --mint:#28744d; --facet:#dfe6ed; }
  }
  @media (max-width:600px) {
    .edition,.kicker,.stack,.portfolio,.terminal-title {display:none}
    .brand {font-size:32px}
    .name {font-size:82px;transform:translateY(-28px)}
    .role {font-size:40px;transform:translateY(-16px)}
    .mobile-stack {display:inline;font-size:36px;fill:var(--muted)}
    .command {font-size:30px}
    .output,.ready {font-size:24px}
    .prompt-caret {transform:translateX(125px)}
    .footer {font-size:40px}
  }
  @media (prefers-reduced-motion:reduce) {
    .motion {animation:none!important}
    .phase-build {opacity:1}.phase-route,.phase-fold {opacity:0}
    .typing-clip {width:535px}
    .flow-in,.flow-cache,.flow-data,.flow-event {opacity:0}
  }
</style>

  <path d="M36 56H1084M36 478H1084" fill="none" stroke="var(--edge)" stroke-width="1.2" stroke-opacity=".75"/>
  <text class="mono brand" x="36" y="31">BackendArchitectX</text>
  <text class="mono edition" x="1084" y="31" text-anchor="end">ENGINEERING IN MOTION</text>
  <text class="mono kicker" x="36" y="99">BACKEND SYSTEMS, BUILT WITH INTENT</text>
  <text class="name" x="36" y="168">Pranay Kadu<tspan fill="var(--accent)">.</tspan></text>
  <text class="role" x="36" y="208">Backend Software Engineer</text>
  <text class="mono stack" x="36" y="244">Java · Spring Boot · Distributed Systems · AWS</text>
  <text class="mono mobile-stack" x="36" y="236">Java · Spring Boot</text>
  <text class="mono mobile-stack" x="36" y="272">Distributed Systems · AWS</text>

  <g id="engineering-terminal">
    <rect x="36" y="285" width="612" height="163" rx="8" fill="none" stroke="var(--edge)" stroke-width="1.3"/>
    <path d="M36 314H648" stroke="var(--edge)" stroke-width="1" stroke-opacity=".7"/>
    <g fill="var(--accent)"><circle cx="53" cy="300" r="3"/><circle cx="66" cy="300" r="3" fill-opacity=".65"/><circle cx="79" cy="300" r="3" fill-opacity=".35"/></g>
    <text class="mono terminal-title" x="342" y="305" text-anchor="middle">pranay@github:~/backend</text>
    <text class="mono command prompt" x="56" y="349">$</text>
    <g class="motion phase-build">
      <text class="mono command" x="79" y="349" clip-path="url(#command-clip)">./mvnw clean package</text>
      <text class="mono output" x="56" y="383">&gt; explicit inputs · testable boundaries</text>
    </g>
    <g class="motion phase-route">
      <text class="mono command" x="79" y="349" clip-path="url(#command-clip)">docker compose up -d</text>
      <text class="mono output" x="56" y="383">&gt; api · service · queue · cache · sql</text>
    </g>
    <g class="motion phase-fold">
      <text class="mono command" x="79" y="349" clip-path="url(#command-clip)">git push origin main</text>
      <text class="mono output" x="56" y="383">&gt; build · ship · improve</text>
    </g>
    <text class="mono ready" x="56" y="427">backendarchitectx &gt;</text>
    <rect class="motion cursor prompt-caret" x="248" y="414" width="9" height="15" rx="1" fill="var(--mint)"/>
  </g>

  <g id="bx-systems-robot" transform="translate(895 276)">
    <g class="motion system-traces" fill="none" stroke="var(--edge)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-150-64H-109Q-94-64-94-49V-37Q-94-23-80-23H-57"/>
      <path d="M57-23H80Q94-23 94-37V-49Q94-64 109-64H150"/>
      <path d="M-28 49V91Q-28 111-48 111H-125"/>
      <path d="M28 49V91Q28 111 48 111H125"/>
      <path d="M0-100V-55" stroke-dasharray="2 6"/>
    </g>
    <g fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 93">
      <path class="motion flow-in" pathLength="100" d="M-150-64H-109Q-94-64-94-49V-37Q-94-23-80-23H-57"/>
      <path class="motion flow-cache" pathLength="100" d="M-28 49V91Q-28 111-48 111H-125"/>
      <path class="motion flow-data" pathLength="100" d="M28 49V91Q28 111 48 111H125"/>
      <path class="motion flow-event" pathLength="100" d="M57-23H80Q94-23 94-37V-49Q94-64 109-64H150"/>
    </g>

    <g class="motion arm-api" transform="translate(-88 -24) rotate(-9)">
      <path d="M-18-31H17L27-20V22L16 31H-20L-27 20V-21Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.6"/>
      <path class="motion mechanical-mark" d="M-13-14V14M-4-14V14M6-14V14M15-14V14" stroke="var(--edge)" stroke-width="2"/>
      <path d="M-20-23H-10M10 23H20" stroke="var(--strong)" stroke-width="2"/>
      <text class="mono motion node-label" y="6">API</text>
    </g>
    <g class="motion arm-kafka" transform="translate(88 -24) rotate(9)">
      <path d="M-17-31H18L27-21V20L20 31H-16L-27 22V-20Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.6"/>
      <path class="motion mechanical-mark" d="M-15-14V14M-6-14V14M4-14V14M13-14V14" stroke="var(--edge)" stroke-width="2"/>
      <path d="M-20-23H-10M10 23H20" stroke="var(--strong)" stroke-width="2"/>
      <text class="mono motion node-label" y="6">Kafka</text>
    </g>
    <g class="motion boot-redis" transform="translate(-30 94) rotate(-7)">
      <path d="M-21-23L-12-29H16L22-20V21L12 29H-17L-23 19Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.4"/>
      <path class="motion mechanical-mark" d="M-12-15H10M-12-5H10M-12 5H10M-12 15H10" stroke="var(--edge)" stroke-width="2"/>
      <text class="mono motion node-label boot-label" y="5">Redis</text>
      <path d="M-14 23H9" stroke="var(--strong)" stroke-width="1.6"/>
    </g>
    <g class="motion boot-sql" transform="translate(30 94) rotate(7)">
      <path d="M-16-29H12L21-23L23 19L17 29H-12L-22 21V-20Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.4"/>
      <path class="motion mechanical-mark" d="M-10-15H12M-10-5H12M-10 5H12M-10 15H12" stroke="var(--edge)" stroke-width="2"/>
      <text class="mono motion node-label boot-label" y="5">SQL</text>
      <path d="M-9 23H14" stroke="var(--strong)" stroke-width="1.6"/>
    </g>

    <path d="M-12-78V-45H12V-78" fill="var(--surface)" stroke="var(--edge)" stroke-width="1.5"/>
    <path d="M-43-55H39L59-26L46 48L0 66L-46 48L-59-26Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.8"/>
    <path d="M-43-55L-27-35H27L39-55M-46 48L-29 30H29L46 48M-59-26L-43-19M43-19L59-26" fill="none" stroke="var(--edge)" stroke-width="1.1"/>
    <path d="M-30-26H24L36-13V18L24 30H-30L-39 18V-13Z" fill="var(--surface)" stroke="var(--edge)" stroke-width="1"/>
    <g transform="translate(-5 1)" fill="none" stroke="var(--strong)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24-16V16H-11Q3 16 3 8Q3 0-11 0H-24M-11 0Q3 0 3-8Q3-16-11-16H-24M14-16L31 16M31-16L14 16"/>
    </g>
    <path class="motion core-ring" d="M-34-43H31L46-23L35 38L0 51L-35 38L-46-23Z" fill="none" stroke="var(--mint)" stroke-width="1.2"/>
    <circle cx="-37" cy="-17" r="2" fill="var(--mint)"/><circle cx="36" cy="-17" r="2" fill="var(--mint)"/>

    <g class="motion head-pod" transform="translate(0 -104) rotate(-3)">
      <path d="M-68-24L-49-43H44L68-17V24L49 42H-44L-68 17Z" fill="url(#bx-metal)" stroke="var(--accent)" stroke-width="1.8"/>
      <path d="M-49-43L-36-31H31L44-43M-68 17L-53 12M52-9L68-17" fill="none" stroke="var(--edge)" stroke-width="1.2"/>
      <path d="M-52-13L-40-25H40L52-9V12L39 24H-41L-52 10Z" fill="var(--surface)" stroke="var(--edge)" stroke-width="1.2"/>
      <path d="M-31-10L-17 1L-31 12M-5 12H13" fill="none" stroke="var(--mint)" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M27-9V-2M34-9V5M41-9V-2" stroke="var(--mint)" stroke-opacity=".45" stroke-width="2"/>
      <rect class="motion visor-caret" x="20" y="9" width="6" height="3" fill="var(--mint)"/>
      <path d="M-43 33H-16M21 33H39" stroke="var(--accent)" stroke-width="1.5"/>
      <path d="M-74-9V10M74-9V10" stroke="var(--strong)" stroke-width="2.2"/>
    </g>
    <text class="mono motion core-label" y="88">SPRING BOOT</text>
    <path d="M-91 154H-52M52 154H91M-35 154H35" fill="none" stroke="var(--edge)" stroke-width="1"/>
  </g>
  <g transform="translate(895 451)">
    <text class="mono motion story-label phase-build">BUILD</text>
    <text class="mono motion story-label phase-route">ROUTE</text>
    <text class="mono motion story-label phase-fold">REASSEMBLE</text>
  </g>
  <text class="mono footer" x="36" y="511">Build for failure. Preserve the invariant.</text>
  <text class="mono footer portfolio" x="1084" y="511" text-anchor="end">backendarchitectx.github.io</text>
</svg>
