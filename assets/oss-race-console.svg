<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.t{fill:#b8d0d8;font-size:13px}.m{fill:#557681;font-size:11px}.ok{fill:#70f0b1}.warn{fill:#ffd166}.bad{fill:#ff667d}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.5}.line{stroke:#245563;stroke-width:2}.packet{fill:#7ee7ff;filter:url(#g)}</style><defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="430" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">LIVE DIAGNOSTICS // RACE + IDENTITY</text><text x="1000" y="40" class="ok" font-size="12">● TRACE ACTIVE</text><text x="32" y="70" class="m">REAL PROBLEM SHAPES FROM OPEN-SOURCE WORK</text>
