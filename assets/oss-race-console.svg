<g transform="translate(35 300)"><text class="t" x="0" y="0">FLUSS // PHYSICAL ENDPOINT IDENTITY</text><rect class="box" x="0" y="28" width="230" height="54" rx="7"/><text class="t" x="24" y="60">UID-42 @ HOST-A:9000</text><rect class="box" x="350" y="28" width="230" height="54" rx="7"/><text class="t" x="374" y="60">UID-42 @ HOST-B:9000</text><path class="line" d="M230 55H350"/><text class="warn" x="258" y="45">MOVE</text><circle r="5" class="packet"><animateMotion dur="2.8s" repeatCount="indefinite" path="M230 55H350"/></circle><text class="bad" x="670" y="50">STALE: UID-42 → HOST-A</text><text class="ok" x="670" y="76">TARGET: UID + HOST + PORT</text></g><text x="935" y="400" class="m">FAULT BOUNDARY // CONTROLLED</text></svg>