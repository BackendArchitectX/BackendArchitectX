<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">Upstream proof rail</title><desc id="d">Cinematic open-source contribution timeline with merged and review-stage signals.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#06070a"/><stop offset=".5" stop-color="#0a0c12"/><stop offset="1" stop-color="#06070a"/></linearGradient><linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#4e6a73" stop-opacity=".15"/><stop offset=".24" stop-color="#76f4ff"/><stop offset=".52" stop-color="#8a7cff"/><stop offset=".76" stop-color="#e65fc5"/><stop offset="1" stop-color="#4e6a73" stop-opacity=".15"/></linearGradient><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer></filter></defs><rect width="1200" height="260" rx="22" fill="url(#bg)"/><g font-family="Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif"><text x="38" y="42" fill="#f0f7fa" font-size="18" font-weight="650">UPSTREAM / PROOF RAIL</text><text x="38" y="64" fill="#748894" font-size="10" letter-spacing="2.8">MERGED SIGNAL ≠ REVIEW-STAGE SIGNAL</text></g><path d="M92 136 H1108" stroke="url(#rail)" stroke-width="2"/><circle r="4" fill="#dfffff" filter="url(#g)"><animateMotion dur="8s" repeatCount="indefinite" path="M92 136 H1108"/></circle><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><g transform="translate(150 136)"><circle r="10" fill="#071418" stroke="#79ffd2" stroke-width="2" filter="url(#g)"/><circle r="4" fill="#79ffd2"/><text x="-42" y="-28" fill="#dffcf0" font-size="12" font-weight="700">AUTOMQ #3493</text><text x="-24" y="38" fill="#79ffd2" font-size="10">MERGED</text></g><g transform="translate(370 136)"><circle r="8" fill="#090b12" stroke="#7ef2ff"/><text x="-38" y="-28" fill="#c7d6dc" font-size="11">TRINO #30973</text><text x="-18" y="36" fill="#61747e" font-size="9">REVIEW</text></g><g transform="translate(590 136)"><circle r="8" fill="#090b12" stroke="#8b7cff"/><text x="-37" y="-28" fill="#c7d6dc" font-size="11">FLUSS #4263</text><text x="-18" y="36" fill="#61747e" font-size="9">REVIEW</text></g><g transform="translate(810 136)"><circle r="8" fill="#090b12" stroke="#d964c4"/><text x="-42" y="-28" fill="#c7d6dc" font-size="11">AUTOMQ #3579</text><text x="-18" y="36" fill="#61747e" font-size="9">REVIEW</text></g><g transform="translate(1030 136)"><circle r="8" fill="#090b12" stroke="#d5a76f"/><text x="-38" y="-28" fill="#c7d6dc" font-size="11">FLUSS #4230</text><text x="-18" y="36" fill="#61747e" font-size="9">REVIEW</text></g></g><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#6f828c" font-size="9"><text x="78" y="220">process roles</text><text x="312" y="220">finalization ownership</text><text x="536" y="220">endpoint identity</text><text x="760" y="220">auth lifecycle</text><text x="995" y="220">metadata mapping</text></g><rect width="1200" height="260" filter="url(#grain)"/></svg>