<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">BackendArchitectX Linux terminal workstation</title>
<desc id="desc">A black and green Linux terminal workstation with tmux-style panes, shell commands, code, git output and backend engineering stack.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#010201"/><stop offset=".5" stop-color="#040704"/><stop offset="1" stop-color="#010201"/></linearGradient>
  <radialGradient id="aura" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#39FF14" stop-opacity=".11"/><stop offset=".55" stop-color="#39FF14" stop-opacity=".025"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#7CFF4F" opacity=".022"/></pattern>
</defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/>
<rect width="1200" height="520" rx="24" fill="url(#aura)"/>
<rect x="1" y="1" width="1198" height="518" rx="23" fill="none" stroke="#39FF14" stroke-opacity=".28"/>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- top bar -->
  <rect x="18" y="18" width="1164" height="34" rx="8" fill="#071007" stroke="#173617"/>
  <circle cx="38" cy="35" r="5" fill="#39FF14"/><circle cx="57" cy="35" r="5" fill="#275c27"/><circle cx="76" cy="35" r="5" fill="#173617"/>
  <text x="100" y="40" fill="#8DCC8D" font-size="13">terminator  —  root@backendarchitectx  —  1920x1080  —  bash 5.x  —  linux</text>
  <text x="1040" y="40" fill="#39FF14" font-size="12">[ONLINE]</text>

  <!-- left main pane -->
  <rect x="18" y="62" width="720" height="388" rx="10" fill="#020402" stroke="#143314"/>
  <text x="40" y="92" fill="#39FF14" font-size="18" font-weight="700">root@backendarchitectx:~# whoami</text>
  <text x="40" y="136" fill="#F3FFF1" font-size="40" font-weight="800">PRANAY KADU</text>
  <text x="40" y="170" fill="#7CFF4F" font-size="20" font-weight="700">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>

  <text x="40" y="214" fill="#39FF14" font-size="17">root@backendarchitectx:~# cat /etc/stack.conf</text>
  <text x="40" y="250" fill="#E2FFE0" font-size="24" font-weight="700">JAVA · SPRING BOOT · DISTRIBUTED SYSTEMS</text>
  <text x="40" y="282" fill="#B6FF00" font-size="21" font-weight="700">KAFKA · REDIS · SQL · KUBERNETES · AWS</text>
  <text x="40" y="314" fill="#A8DFA7" font-size="17">Python · FastAPI · Flask · Node.js · TypeScript · C++ · Docker · Jenkins</text>

  <text x="40" y="360" fill="#39FF14" font-size="17">root@backendarchitectx:~# ./focus --mode=systems</text>
  <text x="40" y="392" fill="#CFFFD0" font-size="16">concurrency  reliability  performance  open-source  failure-semantics</text>
  <text x="40" y="426" fill="#39FF14" font-size="17">root@backendarchitectx:~# <tspan fill="#F3FFF1">_</tspan></text>
  <rect x="355" y="410" width="12" height="20" fill="#39FF14"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.05s" repeatCount="indefinite"/></rect>

  <!-- right top pane -->
  <rect x="748" y="62" width="434" height="186" rx="10" fill="#020402" stroke="#143314"/>
  <text x="768" y="90" fill="#39FF14" font-size="15" font-weight="700">root@backendarchitectx:~/upstream# git log --oneline</text>
  <text x="768" y="122" fill="#B6FF00" font-size="14">● MERGED  AutoMQ #3493</text>
  <text x="768" y="148" fill="#A8DFA7" font-size="13">○ REVIEW  Trino  #30973</text>
  <text x="768" y="174" fill="#A8DFA7" font-size="13">○ REVIEW  Fluss  #4263</text>
  <text x="768" y="200" fill="#7CFF4F" font-size="12">status: source-system semantics / ownership / identity</text>
  <path d="M768 220 H1146" stroke="#39FF14" stroke-opacity=".18"/>

  <!-- right bottom pane -->
  <rect x="748" y="258" width="434" height="192" rx="10" fill="#020402" stroke="#143314"/>
  <text x="768" y="286" fill="#39FF14" font-size="15" font-weight="700">root@backendarchitectx:~# ps aux --sort=-%cpu</text>
  <text x="768" y="316" fill="#6FAF70" font-size="12">PID   PROCESS            STATE</text>
  <text x="768" y="342" fill="#E2FFE0" font-size="13">2711  spring-service     RUNNING</text>
  <text x="768" y="366" fill="#E2FFE0" font-size="13">1844  kafka-consumer      RUNNING</text>
  <text x="768" y="390" fill="#E2FFE0" font-size="13">1442  redis-cache         HEALTHY</text>
  <text x="768" y="414" fill="#E2FFE0" font-size="13"> 917  k8s-worker          READY</text>
  <text x="768" y="438" fill="#39FF14" font-size="12">uptime=99.8%  p95=-40%  mttr=35→12m</text>

  <!-- tmux bar -->
  <rect x="18" y="460" width="1164" height="36" rx="7" fill="#0A170A" stroke="#173617"/>
  <rect x="28" y="468" width="126" height="20" rx="4" fill="#39FF14"/>
  <text x="39" y="483" fill="#020402" font-size="12" font-weight="700">0:backend*</text>
  <text x="171" y="483" fill="#9ED99E" font-size="12">1:git</text>
  <text x="231" y="483" fill="#9ED99E" font-size="12">2:logs</text>
  <text x="304" y="483" fill="#9ED99E" font-size="12">3:kafka</text>
  <text x="377" y="483" fill="#9ED99E" font-size="12">4:k8s</text>
  <text x="988" y="483" fill="#7CFF4F" font-size="12">backendarchitectx</text>
</g>

<rect width="1200" height="520" rx="24" fill="url(#scan)"/>
<rect width="1200" height="520" rx="24" fill="#39FF14" opacity="0"><animate attributeName="opacity" values="0;0;.012;0;0;.008;0" dur="5.2s" repeatCount="indefinite"/></rect>
</svg>