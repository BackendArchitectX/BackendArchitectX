<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">BackendArchitectX anonymous hacker terminal</title>
<desc id="desc">A black and green Linux terminal-inspired hero with a glowing prompt, code rain and anonymous hacker aesthetic.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020403"/>
    <stop offset="0.55" stop-color="#050806"/>
    <stop offset="1" stop-color="#010201"/>
  </linearGradient>
  <radialGradient id="aura" cx="34%" cy="50%" r="58%">
    <stop offset="0" stop-color="#39FF14" stop-opacity="0.17"/>
    <stop offset="0.48" stop-color="#39FF14" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#7CFF4F" opacity="0.03"/>
  </pattern>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#39FF14" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<rect width="1200" height="430" rx="26" fill="url(#grid)"/>
<rect width="1200" height="430" rx="26" fill="url(#aura)"/>
<rect x="1" y="1" width="1198" height="428" rx="25" fill="none" stroke="#39FF14" stroke-opacity="0.34"/>

<!-- subtle code rain -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#39FF14" opacity="0.10">
  <text x="30" y="30">01001001 11000101 01101110</text>
  <text x="865" y="40">sudo ./bootstrap --kernel</text>
  <text x="935" y="72">0x7f :: kafka :: redis</text>
  <text x="880" y="102">fork()  exec()  epoll()</text>
  <text x="970" y="132">ssh -T upstream</text>
  <text x="885" y="162">java -XX:+UseG1GC</text>
  <text x="940" y="192">systemctl status</text>
  <text x="886" y="222">netstat -tulpn</text>
  <text x="960" y="252">journalctl -f</text>
  <text x="900" y="282">git log --oneline</text>
  <text x="972" y="312">kubectl get pods</text>
  <text x="894" y="342">redis-cli ping</text>
  <text x="952" y="372">SELECT 1;</text>
</g>

<!-- faceless hood silhouette, intentionally generic -->
<g transform="translate(860 78)" opacity="0.18">
  <path d="M120 0 C65 10 32 56 25 118 C19 172 45 220 91 243 C120 258 153 259 182 243 C228 219 252 173 247 118 C241 56 207 11 150 0 Z" fill="#061006" stroke="#39FF14" stroke-opacity="0.25"/>
  <path d="M82 72 C91 45 112 31 136 31 C162 31 184 47 194 75 C203 102 197 134 182 154 C169 171 154 180 137 180 C119 180 102 171 90 154 C76 133 73 100 82 72 Z" fill="#010201"/>
  <path d="M18 282 C41 223 85 193 136 193 C187 193 232 224 255 282 L255 334 L18 334 Z" fill="#030603" stroke="#39FF14" stroke-opacity="0.16"/>
</g>

<!-- giant prompt inspired by uploaded reference -->
<g transform="translate(56 108)" filter="url(#glow)">
  <path d="M0 0 L118 96 L0 192" fill="none" stroke="#39FF14" stroke-width="24" stroke-linejoin="miter" stroke-linecap="square"/>
  <path d="M172 192 H315" stroke="#39FF14" stroke-width="24" stroke-linecap="square"/>
  <rect x="323" y="170" width="20" height="28" fill="#7CFF4F">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="448" y="74" fill="#6ea86b" font-size="14" letter-spacing="2">[ tty0 ]  [ linux ]  [ access: granted ]</text>
  <text x="448" y="132" fill="#39FF14" font-size="19" font-weight="700">root@backendarchitectx:~# whoami</text>
  <text x="448" y="178" fill="#F2FFF0" font-size="42" font-weight="800" letter-spacing="-1">PRANAY KADU</text>
  <text x="448" y="216" fill="#7CFF4F" font-size="20" font-weight="700">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>
  <text x="448" y="262" fill="#39FF14" font-size="17">root@backendarchitectx:~# cat /etc/stack</text>
  <text x="448" y="298" fill="#CFFFD0" font-size="18">JAVA  SPRING BOOT  KAFKA  REDIS  SQL  KUBERNETES  AWS</text>
  <text x="448" y="330" fill="#8FCF91" font-size="15">Python · FastAPI · Flask · Node.js · TypeScript · C++ · Docker · Jenkins</text>
  <text x="448" y="378" fill="#39FF14" font-size="17">root@backendarchitectx:~# <tspan fill="#CFFFD0">observe → isolate → model → prove → operate</tspan></text>
</g>

<rect width="1200" height="430" rx="26" fill="url(#scan)" pointer-events="none"/>

<!-- slight CRT flicker -->
<rect width="1200" height="430" rx="26" fill="#39FF14" opacity="0">
  <animate attributeName="opacity" values="0;0;.018;0;0;.012;0" dur="4.8s" repeatCount="indefinite"/>
</rect>
</svg>