<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#8af2ff;font-size:18px;font-weight:700}.t{fill:#d8f7fb;font-size:13px}.m{fill:#66838c;font-size:11px}.ok{fill:#67f5ae}.warn{fill:#ffd166}.bad{fill:#ff6b7a}.box{fill:#071218;stroke:#1b5260;stroke-width:1.5}.edge{stroke:#1b5968;stroke-width:2;fill:none}.dash{stroke:#ff6b7a;stroke-dasharray:6 6;stroke-width:2;fill:none}.pulse{animation:p 1.5s ease-in-out infinite}@keyframes p{50%{opacity:.25}}</style><rect width="1200" height="360" rx="16" fill="#040a0e" stroke="#173c47"/><text x="36" y="40" class="h">FAULT TRACE // REQUEST LIFECYCLE</text><text x="980" y="40" class="ok">● LIVE</text><text x="36" y="68" class="m">NORMAL FLOW + FAILURE BOUNDARY + RECOVERY PATH</text><g transform="translate(40 120)"><rect class="box" width="150" height="64" rx="7"/><text class="m" x="16" y="22">INGRESS</text><text class="t" x="16" y="45">API GATEWAY</text><rect class="box" x="220" width="150" height="64" rx="7"/><text class="m" x="236" y="22">COMPUTE</text><text class="t" x="236" y="45">JAVA SERVICE</text><rect class="box" x="440" width="150" height="64" rx="7"/><text class="m" x="456" y="22">STREAM</text><text class="t" x="456" y="45">KAFKA</text><rect class="box" x="660" width="150" height="64" rx="7"/><text class="m" x="676" y="22">STATE</text><text class="t" x="676" y="45">REDIS</text><rect class="box" x="880" width="150" height="64" rx="7"/><text class="m" x="896" y="22">DURABLE</text><text class="t" x="896" y="45">SQL</text><path class="edge" d="M150 32H220M370 32H440M590 32H660M810 32H880"/><circle r="5" fill="#7ee7ff"><animateMotion dur="4.2s" repeatCount="indefinite" path="M150 32H880"/></circle></g><g transform="translate(40 230)"><text class="m" x="0" y="0">INJECTED CONDITION</text><text class="bad" x="180" y="0">STALE ENDPOINT / COMMIT RACE / RESOURCE LEAK</text><path class="dash" d="M470 -8H780"/><circle cx="785" cy="-8" r="6" class="bad pulse"/><text class="m" x="0" y="38">RECOVERY POLICY</text><text class="ok" x="180" y="38">EXPLICIT OWNERSHIP → VALIDATION → FALLBACK / RETRY → DETERMINISTIC TEST</text><text class="m" x="0" y="76">OBSERVABILITY</text><text class="t" x="180" y="76">TRACE ID · STATE TRANSITION · LIFECYCLE BOUNDARY · ERROR CLASSIFICATION</text></g><rect x="990" y="275" width="150" height="42" rx="6" fill="#071218" stroke="#1f6d55"/><text x="1011" y="301" class="ok">STATE: RECOVERED</text></svg>