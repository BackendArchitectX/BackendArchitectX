<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
<title id="title">Upstream proof rail</title><desc id="desc">A premium neon editorial timeline of merged and review-stage open-source contributions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#090b13"/></linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5ff"/><stop offset=".45" stop-color="#7c5cff"/><stop offset=".72" stop-color="#ff2bd6"/><stop offset="1" stop-color="#b8ff2c"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="18"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .04"/></feComponentTransfer></filter>
  <style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}</style>
</defs>
<rect width="1200" height="250" rx="24" fill="url(#bg)"/><rect width="1200" height="250" rx="24" filter="url(#grain)" opacity=".8"/>
<rect x="1" y="1" width="1198" height="248" rx="23" fill="none" stroke="#1a2433"/>
<text x="42" y="44" class="sans" fill="#f8fbff" font-size="12" letter-spacing="3">UPSTREAM / PROOF OF WORK</text>
<text x="42" y="70" class="mono" fill="#66758a" font-size="10">merged evidence is weighted above work still under review</text>
<line x1="54" y1="132" x2="1146" y2="132" stroke="#263244" stroke-width="2"/>
<line x1="54" y1="132" x2="1146" y2="132" stroke="url(#rail)" stroke-width="1.5" opacity=".72"/>
<circle r="4" fill="#b8ff2c" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M54 132 H1146"/></circle>
<g class="sans">
  <g transform="translate(92 132)"><circle r="9" fill="#08120b" stroke="#b8ff2c" stroke-width="2" filter="url(#glow)"/><text x="-20" y="-28" fill="#b8ff2c" font-size="11" font-weight="700">MERGED</text><text x="-33" y="39" fill="#f8fbff" font-size="14" font-weight="700">AutoMQ #3493</text><text x="-33" y="58" fill="#718096" font-size="10">process-role lifecycle</text></g>
  <g transform="translate(350 132)"><circle r="7" fill="#071019" stroke="#00f5ff" stroke-width="1.5"/><text x="-26" y="-28" fill="#00f5ff" font-size="10">REVIEW</text><text x="-29" y="39" fill="#dce4ef" font-size="13" font-weight="650">Trino #30973</text><text x="-44" y="58" fill="#718096" font-size="10">finalization ownership</text></g>
  <g transform="translate(585 132)"><circle r="7" fill="#0b0914" stroke="#7c5cff" stroke-width="1.5"/><text x="-26" y="-28" fill="#9b88ff" font-size="10">REVIEW</text><text x="-30" y="39" fill="#dce4ef" font-size="13" font-weight="650">Fluss #4263</text><text x="-40" y="58" fill="#718096" font-size="10">endpoint identity</text></g>
  <g transform="translate(820 132)"><circle r="7" fill="#130912" stroke="#ff2bd6" stroke-width="1.5"/><text x="-26" y="-28" fill="#ff57e0" font-size="10">REVIEW</text><text x="-39" y="39" fill="#dce4ef" font-size="13" font-weight="650">AutoMQ #3579</text><text x="-37" y="58" fill="#718096" font-size="10">auth lifecycle</text></g>
  <g transform="translate(1052 132)"><circle r="7" fill="#101408" stroke="#b8ff2c" stroke-width="1.2" opacity=".8"/><text x="-26" y="-28" fill="#c7ff6b" font-size="10">REVIEW</text><text x="-31" y="39" fill="#dce4ef" font-size="13" font-weight="650">Fluss #4230</text><text x="-44" y="58" fill="#718096" font-size="10">metadata mapping</text></g>
</g>
</svg>