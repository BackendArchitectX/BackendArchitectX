<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="operator-title operator-description">
  <title id="operator-title">Pranay Kadu — BackendArchitectX</title>
  <desc id="operator-description">Backend Software Engineer. Java, Spring Boot, Distributed Systems and AWS. A custom graphite and titanium robot turns toward an illustrative transaction terminal. Its cyan optical aperture follows two requests with the same identifier; the duplicate is ignored and the transaction is committed once. The canvas and terminal background are transparent. Text adapts to the page theme. A complete still illustration is shown when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="shell" x1=".12" y1="0" x2=".82" y2="1">
      <stop stop-color="#728496"/><stop offset=".21" stop-color="#3d4e60"/><stop offset=".56" stop-color="#202d3b"/><stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#e1eaf2"/><stop offset=".18" stop-color="#a8b6c8"/><stop offset=".51" stop-color="#60768c"/><stop offset=".77" stop-color="#8e9fb1"/><stop offset="1" stop-color="#465d73"/>
    </linearGradient>
    <linearGradient id="brow" x1="0" y1="0" x2=".55" y2="1">
      <stop stop-color="#bac9d7"/><stop offset=".2" stop-color="#6d8297"/><stop offset=".26" stop-color="#3b5065"/><stop offset="1" stop-color="#172534"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#35475a"/><stop offset=".4" stop-color="#18212b"/><stop offset="1" stop-color="#0c141d"/>
    </linearGradient>
    <linearGradient id="glass" x1=".3" y1="0" x2=".6" y2="1">
      <stop stop-color="#1f3548"/><stop offset=".34" stop-color="#0a1927"/><stop offset="1" stop-color="#050e17"/>
    </linearGradient>
    <linearGradient id="glass-reflection" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#d2eeff" stop-opacity=".23"/><stop offset=".6" stop-color="#79c6e7" stop-opacity=".045"/><stop offset="1" stop-color="#79c6e7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#111b27"/><stop offset=".37" stop-color="#6b7f93"/><stop offset=".53" stop-color="#182735"/><stop offset=".82" stop-color="#40576b"/><stop offset="1" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d4fcff"/><stop offset=".34" stop-color="#48d6ef"/><stop offset="1" stop-color="#1684ad"/>
    </linearGradient>
    <linearGradient id="torso-fade" gradientUnits="userSpaceOnUse" x1="0" y1="298" x2="0" y2="345">
      <stop offset="0" stop-color="white"/><stop offset=".35" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="bust-fade" maskUnits="userSpaceOnUse" x="0" y="202" width="368" height="154"><rect x="0" y="202" width="368" height="154" fill="url(#torso-fade)"/></mask>
    <filter id="optic-glow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <clipPath id="visor-clip"><path d="M110 94 129 80 215 90 234 112 227 142 195 158 136 147 114 130Z"/></clipPath>
    <clipPath id="replay-reveal"><rect class="motion replay-reveal" x="76" y="330" width="510" height="27"/></clipPath>
  </defs>
  <style>
    :root { --ink:#edf5fc;--muted:#9eafbf;--edge:#354554;--signal:#48d6ef;--signal-soft:#abeaf4; }
    text {fill:var(--ink);font-family:'Segoe UI',Arial,sans-serif}
    .mono {font-family:'DejaVu Sans Mono','Liberation Mono',Consolas,monospace}
    .brand {font-size:15px;letter-spacing:1px;fill:var(--muted)}
    .kicker {font-size:13px;letter-spacing:2.7px;fill:var(--signal)}
    .name {font-size:67px;letter-spacing:-2.6px;font-weight:600}
    .role {font-size:23px;font-weight:400}
    .stack {font-size:18px;fill:var(--muted)}
    .terminal-label {font-size:13px;fill:var(--muted)}
    .illustration-label {font-size:10px;letter-spacing:1.4px;fill:var(--muted)}
    .terminal-line {font-size:18px}
    .terminal-note {font-size:16px;fill:var(--muted)}
    .signal {fill:var(--signal)}
    .terminal-final {fill:var(--signal-soft)}
    .footer {font-size:15px;fill:var(--muted)}
    .mobile-stack,.mobile-terminal,.mobile-footer {display:none}
    .robot-head {transform-origin:187px 151px;animation:head-attend 6.8s cubic-bezier(.4,0,.2,1) infinite}
    .optical-aperture {animation:optic-track 6.8s cubic-bezier(.4,0,.2,1) infinite}
    .lens-glow {animation:optic-energy 6.8s ease-in-out infinite}
    .scan-sweep {opacity:0;animation:visor-scan 6.8s linear infinite}
    .request-first {opacity:0;animation:request-first 6.8s linear infinite}
    .request-replay {opacity:0;animation:request-replay 6.8s linear infinite}
    .response {opacity:0;animation:response 6.8s linear infinite}
    .replay-line {opacity:0;animation:replay-line 6.8s steps(1,end) infinite}
    .replay-reveal {animation:replay-reveal 6.8s linear infinite}
    .commit-line {opacity:0;animation:commit-line 6.8s ease-out infinite}
    .commit-indicator {opacity:.12;animation:commit-indicator 6.8s ease-out infinite}
    .cursor {animation:cursor 1s steps(1,end) infinite}
    @keyframes head-attend {
      0%,4%,90%,100% {transform:translate(0,0) rotate(1.2deg)}
      12%,29% {transform:translate(-2px,1px) rotate(-2.2deg)}
      35%,53% {transform:translate(-3px,0) rotate(-3.4deg)}
      63%,77% {transform:translate(-1px,2px) rotate(-.5deg)}
    }
    @keyframes optic-track {
      0%,4%,90%,100% {transform:translate(7px,0)}
      11%,27% {transform:translate(-4px,1px)}
      34%,44% {transform:translate(1px,-1px)}
      49%,76% {transform:translate(-3px,1px)}
    }
    @keyframes optic-energy {0%,4%,85%,100% {opacity:.5} 13%,24%,38%,44%,61%,72% {opacity:1} 30%,51% {opacity:.65}}
    @keyframes visor-scan {
      0%,15% {opacity:0;transform:translateX(0)}
      16% {opacity:.65} 26% {opacity:.65;transform:translateX(116px)} 27% {opacity:0;transform:translateX(116px)}
      32% {opacity:0;transform:translateX(0)} 33% {opacity:.8} 43% {opacity:.8;transform:translateX(116px)}
      44%,100% {opacity:0;transform:translateX(116px)}
    }
    @keyframes request-first {0%,4% {opacity:0;stroke-dashoffset:100} 5% {opacity:1;stroke-dashoffset:100} 17% {opacity:1;stroke-dashoffset:0} 18%,100% {opacity:0;stroke-dashoffset:0}}
    @keyframes request-replay {0%,28% {opacity:0;stroke-dashoffset:100} 29% {opacity:1;stroke-dashoffset:100} 41% {opacity:1;stroke-dashoffset:0} 42%,100% {opacity:0;stroke-dashoffset:0}}
    @keyframes response {0%,52% {opacity:0;stroke-dashoffset:0} 53% {opacity:1;stroke-dashoffset:0} 64% {opacity:1;stroke-dashoffset:100} 65%,100% {opacity:0;stroke-dashoffset:100}}
    @keyframes replay-line {0%,28.9% {opacity:0} 29%,100% {opacity:1}}
    @keyframes replay-reveal {0%,28% {width:0} 43%,100% {width:510px}}
    @keyframes commit-line {0%,62% {opacity:0;transform:translateY(2px)} 66%,100% {opacity:1;transform:translateY(0)}}
    @keyframes commit-indicator {0%,52% {opacity:.12} 56%,64% {opacity:1} 76%,100% {opacity:.12}}
    @keyframes cursor {0%,49% {opacity:.9} 50%,100% {opacity:0}}
    @media (prefers-color-scheme:light) {
      :root {--ink:#1c2733;--muted:#526477;--edge:#c2cdd8;--signal:#087b91;--signal-soft:#066b80}
    }
    @media (max-width:600px) {
      .brand,.kicker,.stack,.engineering-terminal,.request-link,.footer,.top-rule {display:none}
      .name {font-size:84px;letter-spacing:-3px;transform:translateY(-19px)}
      .role {font-size:40px;transform:translateY(-12px)}
      .mobile-stack {display:inline;font-size:40px;fill:var(--muted)}
      .mobile-terminal {display:inline;font-size:40px}
      .mobile-footer {display:inline;font-size:40px;fill:var(--muted)}
    }
    @media (prefers-reduced-motion:reduce) {
      .motion {animation:none!important}
      .replay-line,.commit-line {opacity:1;transform:none}
      .replay-reveal {width:510px}
      .request-first,.request-replay,.response,.scan-sweep,.cursor {display:none}
      .commit-indicator {opacity:.75}
      .robot-head {transform:none}
    }
  </style>

  <text class="mono brand" x="32" y="29">BackendArchitectX</text>
  <path class="top-rule" d="M32 49H1088" fill="none" stroke="var(--edge)"/>
  <text class="mono kicker" x="32" y="93">BACKEND ENGINEERING</text>
  <text class="name" x="29" y="157">Pranay Kadu<tspan fill="var(--signal)">.</tspan></text>
  <text class="role" x="32" y="201">Backend Software Engineer</text>
  <text class="mono stack" x="32" y="238">Java · Spring Boot · Distributed Systems · AWS</text>
  <text class="mono mobile-stack" x="32" y="241">Java · Spring Boot</text>
  <text class="mono mobile-stack" x="32" y="289">Distributed Systems · AWS</text>

  <g class="request-link" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M636 320H668Q688 320 688 300V218Q688 196 710 196H826" stroke="var(--edge)" stroke-width="1" stroke-opacity=".65"/>
    <g stroke="var(--signal)" stroke-width="2.6" stroke-dasharray="5 95">
      <path class="motion request-first" pathLength="100" d="M636 320H668Q688 320 688 300V218Q688 196 710 196H826"/>
      <path class="motion request-replay" pathLength="100" d="M636 320H668Q688 320 688 300V218Q688 196 710 196H826"/>
      <path class="motion response" pathLength="100" d="M636 320H668Q688 320 688 300V218Q688 196 710 196H826"/>
    </g>
  </g>

  <g class="engineering-terminal">
    <rect x="32" y="270" width="604" height="136" rx="7" fill="none" stroke="var(--edge)"/>
    <path d="M32 297H636" stroke="var(--edge)" stroke-opacity=".7"/>
    <circle cx="49" cy="284" r="2.5" fill="var(--signal)"/>
    <text class="mono terminal-label" x="62" y="289">transaction replay</text>
    <text class="mono illustration-label" x="617" y="288" text-anchor="end">ILLUSTRATION</text>
    <text class="mono terminal-line" x="51" y="323"><tspan class="signal">&gt;</tspan><tspan x="76">request  tx_041</tspan></text>
    <g class="motion replay-line">
      <text class="mono terminal-line signal" x="51" y="349">&gt;</text>
      <text class="mono terminal-line" x="76" y="349" clip-path="url(#replay-reveal)">replay   tx_041<tspan class="terminal-note"> · duplicate ignored</tspan></text>
    </g>
    <g class="motion commit-line">
      <path d="m52 375 4 4 8-9" fill="none" stroke="var(--signal-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="mono terminal-line terminal-final" x="76" y="380">committed once</text>
      <rect class="motion cursor" x="244" y="367" width="7" height="15" fill="var(--signal-soft)"/>
    </g>
  </g>
  <g class="mono mobile-terminal">
    <text x="32" y="351" class="signal">&gt; replay tx_041 × 2</text>
    <text x="32" y="399" class="motion commit-line terminal-final">committed once</text>
  </g>

