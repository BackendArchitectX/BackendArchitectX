<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.big{fill:#e5fbff;font-size:25px;font-weight:700}.t{fill:#b8d0d8;font-size:12px}.m{fill:#557681;font-size:10px}.ok{fill:#70f0b1}.box{fill:#07151b;stroke:#225c6a;stroke-width:1.4}.bar{fill:#1e8295}</style><rect width="1200" height="330" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">VORTEX // GPU VECTOR TELEMETRY</text><text x="32" y="67" class="m">RTX 3050 6GB LAPTOP GPU // EXACT SQUARED-L2 // DOCUMENTED BENCHMARK WORKLOAD</text><g transform="translate(40 100)"><rect class="box" width="245" height="110" rx="8"/><text x="20" y="30" class="m">FP32 P50</text><text x="20" y="68" class="big">~1.67–1.72 ms</text><text x="20" y="92" class="t">500K × 128 workload</text><rect class="box" x="285" width="245" height="110" rx="8"/><text x="305" y="30" class="m">FP32 THROUGHPUT</text><text x="305" y="68" class="big">~1,641–1,662</text><text x="305" y="92" class="t">QPS @ batch 32</text><rect class="box" x="570" width="245" height="110" rx="8"/><text x="590" y="30" class="m">RECALL@10</text><text x="590" y="68" class="big">99.6875%</text><text x="590" y="92" class="t">specified FP16 workload</text><rect class="box" x="855" width="245" height="110" rx="8"/><text x="875" y="30" class="m">FP16 STORAGE</text><text x="875" y="68" class="big">−50%</text><text x="875" y="92" class="t">vs FP32 vectors</text></g><g transform="translate(40 244)"><text class="m" y="0">PIPELINE</text><text class="t" x="90" y="0">SPRING BOOT → JNI → CUDA → PERSISTENT GPU INDEX → EXACT TOP-K</text><rect x="90" y="20" width="950" height="4" rx="2" fill="#102a32"/><rect x="90" y="20" width="180" height="4" rx="2" class="bar"><animate attributeName="x" values="90;860;90" dur="4s" repeatCount="indefinite"/></rect><text x="40" y="67" class="m">COMPARISON DISCIPLINE // scalar CPU reference is not presented as an optimized production vector database</text></g></svg>