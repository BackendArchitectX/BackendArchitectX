<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pranay Kadu — Distributed Systems Command Center</title>
  <desc id="desc">Animated sci-fi systems dashboard showing request flow through gateway, services, Kafka, cache and storage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03080c"/>
      <stop offset="0.55" stop-color="#06131a"/>
      <stop offset="1" stop-color="#02070a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3340"/>
      <stop offset="0.5" stop-color="#36e8ff"/>
      <stop offset="1" stop-color="#0b3340"/>
    </linearGradient>
    <radialGradient id="nodeGlow">
      <stop offset="0" stop-color="#6ef4ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6ef4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13313b" stroke-width="1" stroke-opacity="0.26"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#1d5d6c" stroke-opacity="0.55"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="64" fill="#86f7ff" font-size="14" letter-spacing="3">BACKEND ARCHITECT X // SYSTEMS CONSOLE</text>
    <text x="52" y="112" fill="#edfaff" font-size="34" font-weight="700" letter-spacing="1">PRANAY KADU</text>
    <text x="52" y="142" fill="#87aab3" font-size="15" letter-spacing="1.8">DISTRIBUTED SYSTEMS · CONCURRENCY · RELIABILITY · PERFORMANCE</text>

    <g transform="translate(925 38)">
      <rect width="220" height="78" rx="8" fill="#07151b" stroke="#174753"/>
      <circle cx="22" cy="22" r="5" fill="#52ffa8" filter="url(#glow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="38" y="27" fill="#9fffd0" font-size="12" letter-spacing="1.5">SYSTEM MAP ACTIVE</text>
      <text x="18" y="52" fill="#4f7580" font-size="10">FAULT BOUNDARIES / DATA FLOW / LIFECYCLE</text>
      <rect x="18" y="61" width="182" height="3" rx="2" fill="#0d2830"/>
      <rect x="18" y="61" width="74" height="3" rx="2" fill="#40eaff">
        <animate attributeName="x" values="18;126;18" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="width" values="74;34;74" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g opacity="0.95">
      <path d="M128 270 H300" stroke="url(#edge)" stroke-width="2"/>
      <path d="M390 270 H558" stroke="url(#edge)" stroke-width="2"/>
      <path d="M650 270 H815" stroke="url(#edge)" stroke-width="2"/>
      <path d="M895 270 H1068" stroke="url(#edge)" stroke-width="2"/>
      <path d="M605 310 V355 H875 V310" stroke="#1d6170" stroke-width="1.5" fill="none"/>
      <path d="M605 230 V195 H875 V230" stroke="#1d6170" stroke-width="1.5" fill="none"/>
    </g>

    <g fill="#63efff" filter="url(#glow)">
      <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M128 270 H300"/></circle>
      <circle r="4"><animateMotion dur="2.1s" begin="0.45s" repeatCount="indefinite" path="M390 270 H558"/></circle>
      <circle r="4"><animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M650 270 H815"/></circle>
      <circle r="4"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M895 270 H1068"/></circle>
      <circle r="3"><animateMotion dur="3.6s" begin="0.7s" repeatCount="indefinite" path="M605 230 V195 H875 V230"/></circle>
      <circle r="3"><animateMotion dur="3.1s" begin="1.2s" repeatCount="indefinite" path="M875 310 V355 H605 V310"/></circle>
    </g>

    <g id="node1" transform="translate(58 230)">
      <circle cx="70" cy="40" r="58" fill="url(#nodeGlow)" opacity="0.45"><animate attributeName="r" values="54;62;54" dur="3s" repeatCount="indefinite"/></circle>
      <rect x="0" y="0" width="140" height="80" rx="10" fill="#07151a" stroke="#1e6170"/>
      <text x="16" y="25" fill="#5f7f88" font-size="10">INGRESS</text>
      <text x="16" y="49" fill="#dffbff" font-size="16" font-weight="700">API GATEWAY</text>
      <text x="16" y="67" fill="#50d7e9" font-size="10">REQUEST / AUTH / ROUTE</text>
    </g>

    <g transform="translate(300 230)">
      <circle cx="45" cy="40" r="54" fill="url(#nodeGlow)" opacity="0.32"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <rect width="90" height="80" rx="10" fill="#07151a" stroke="#24788a"/>
      <text x="13" y="25" fill="#5f7f88" font-size="10">COMPUTE</text>
      <text x="13" y="49" fill="#e8fcff" font-size="15" font-weight="700">SERVICE</text>
      <text x="13" y="67" fill="#4ad0e0" font-size="9">JAVA / JVM</text>
    </g>

    <g transform="translate(558 230)">
      <circle cx="47" cy="40" r="55" fill="url(#nodeGlow)" opacity="0.3"><animate attributeName="opacity" values="0.18;0.48;0.18" dur="2.8s" repeatCount="indefinite"/></circle>
      <rect width="94" height="80" rx="10" fill="#07151a" stroke="#24788a"/>
      <text x="14" y="25" fill="#5f7f88" font-size="10">STREAM</text>
      <text x="14" y="49" fill="#e8fcff" font-size="15" font-weight="700">KAFKA</text>
      <text x="14" y="67" fill="#4ad0e0" font-size="9">EVENT FLOW</text>
    </g>

    <g transform="translate(815 230)">
      <circle cx="40" cy="40" r="52" fill="url(#nodeGlow)" opacity="0.28"><animate attributeName="opacity" values="0.16;0.46;0.16" dur="3.2s" repeatCount="indefinite"/></circle>
      <rect width="80" height="80" rx="10" fill="#07151a" stroke="#24788a"/>
      <text x="13" y="25" fill="#5f7f88" font-size="10">STATE</text>
      <text x="13" y="49" fill="#e8fcff" font-size="14" font-weight="700">REDIS</text>
      <text x="13" y="67" fill="#4ad0e0" font-size="9">HOT PATH</text>
    </g>

    <g transform="translate(1068 230)">
      <circle cx="37" cy="40" r="50" fill="url(#nodeGlow)" opacity="0.26"><animate attributeName="opacity" values="0.14;0.42;0.14" dur="2.9s" repeatCount="indefinite"/></circle>
      <rect width="74" height="80" rx="10" fill="#07151a" stroke="#24788a"/>
      <text x="11" y="25" fill="#5f7f88" font-size="10">DATA</text>
      <text x="11" y="49" fill="#e8fcff" font-size="14" font-weight="700">SQL</text>
      <text x="11" y="67" fill="#4ad0e0" font-size="9">DURABLE</text>
    </g>

    <g transform="translate(680 158)">
      <rect width="390" height="38" rx="7" fill="#061218" stroke="#173c47"/>
      <text x="14" y="24" fill="#789aa3" font-size="10">TRACE</text>
      <text x="68" y="24" fill="#68edf8" font-size="10">REQUEST → SERVICE → STREAM → CACHE → STORAGE</text>
      <rect x="360" y="10" width="14" height="18" fill="#66efff">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(52 356)">
      <text y="0" fill="#42626b" font-size="10" letter-spacing="1.5">OPERATING PRINCIPLES</text>
      <text y="24" fill="#91b7c0" font-size="11">CORRECTNESS BEFORE CLEVERNESS  //  EXPLICIT FAILURE STATES  //  DETERMINISTIC RACE TESTS  //  OWN RESOURCE LIFECYCLE</text>
    </g>
  </g>
</svg>