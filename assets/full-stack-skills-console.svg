<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.s{fill:#70f0b1;font-size:12px}.t{fill:#c7dde3;font-size:12px}.m{fill:#637f88;font-size:10px}.k{fill:#ffd166;font-size:11px}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.3}.lane{stroke:#1d5968;stroke-width:2}.dot{fill:#7ee7ff}.good{fill:#70f0b1}.muted{fill:#89a6ae}</style><rect width="1200" height="650" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">ENGINEERING STACK // MULTI-RUNTIME PRODUCTION MAP</text><text x="1010" y="40" class="s">● RESUME-SYNCED</text><text x="32" y="68" class="m">PRIMARY JVM SYSTEMS DEPTH // PYTHON SERVICES // TYPESCRIPT/NODE INTEGRATION // C++ NATIVE WORK // REACT CLIENT DELIVERY</text>
