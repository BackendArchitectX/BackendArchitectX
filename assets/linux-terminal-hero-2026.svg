<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Pranay Kadu Linux Terminal Profile</title>
<desc id="desc">Minimal green-on-black Linux terminal hero highlighting backend and distributed systems engineering skills.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030603"/><stop offset="1" stop-color="#071007"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#39FF14" opacity=".025"/></pattern>
</defs>
<rect width="1200" height="520" rx="18" fill="#010201"/>
<rect x="12" y="12" width="1176" height="496" rx="15" fill="url(#bg)" stroke="#163516" stroke-width="1.5"/>
<rect x="12" y="12" width="1176" height="52" rx="15" fill="#091109"/>
<rect x="12" y="48" width="1176" height="16" fill="#091109"/>
<circle cx="42" cy="38" r="6" fill="#39FF14" opacity=".45"/>
<circle cx="64" cy="38" r="6" fill="#39FF14" opacity=".25"/>
<circle cx="86" cy="38" r="6" fill="#39FF14" opacity=".15"/>
<text x="600" y="43" text-anchor="middle" fill="#6f8d6f" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">backendarchitectx@linux: ~</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <text x="44" y="105" fill="#39FF14" font-size="22" font-weight="700">pranay@backendarchitectx:~$ whoami</text>
  <text x="44" y="145" fill="#eaffea" font-size="31" font-weight="700">Pranay Kadu — Backend &amp; Distributed Systems Engineer</text>

  <text x="44" y="198" fill="#39FF14" font-size="22" font-weight="700">pranay@backendarchitectx:~$ cat /etc/core-stack</text>
  <text x="44" y="238" fill="#b8ffb0" font-size="27" font-weight="700">JAVA  SPRING BOOT  DISTRIBUTED SYSTEMS  KAFKA  REDIS</text>
  <text x="44" y="276" fill="#90e890" font-size="24">KUBERNETES  AWS/EKS  SQL  PYTHON  FASTAPI  NODE.JS  C++</text>

  <text x="44" y="329" fill="#39FF14" font-size="22" font-weight="700">pranay@backendarchitectx:~$ systemctl status engineering.service</text>
  <text x="44" y="368" fill="#b6ff00" font-size="20">● active (running)</text>
  <text x="270" y="368" fill="#a8cfa5" font-size="20">concurrency · event-driven systems · performance · reliability · open source</text>

  <text x="44" y="421" fill="#39FF14" font-size="22" font-weight="700">pranay@backendarchitectx:~$ echo $FOCUS</text>
  <text x="44" y="458" fill="#dfffe3" font-size="22">correctness / ownership / lifecycle / idempotency / operability</text>
  <rect x="44" y="478" width="13" height="24" fill="#39FF14" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</g>
<rect x="12" y="64" width="1176" height="444" fill="url(#scan)" pointer-events="none"/>
<rect x="13" y="13" width="1174" height="494" rx="14" fill="none" stroke="#39FF14" stroke-opacity=".18"/>
</svg>