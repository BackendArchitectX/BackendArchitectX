<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">BackendArchitectX Linux engineering terminal</title><desc id="d">Sci-fi Linux coding terminal with backend systems telemetry, code fragments, production metrics and runtime lanes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020504"/><stop offset=".52" stop-color="#07100c"/><stop offset="1" stop-color="#030707"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5cff9d"/><stop offset=".5" stop-color="#6ce7ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#123022" stroke-opacity=".22"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="560" rx="18" fill="url(#bg)"/><rect width="1200" height="560" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="558" rx="17" fill="none" stroke="#1f5b3a"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="44" y="42" fill="#4f7960" font-size="11">tty0 / secure-shell / backendarchitectx</text><circle cx="1128" cy="34" r="5" fill="#63ff9e" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/></circle><text x="1142" y="38" fill="#63ff9e" font-size="10">ONLINE</text><text x="44" y="88" fill="#92ffba" font-size="14">pranay@backendarchitectx:~$</text><text x="315" y="88" fill="#d9ffe5" font-size="14">whoami</text><text x="44" y="122" fill="#f0fff4" font-size="32" font-weight="700">PRANAY KADU</text><text x="44" y="151" fill="#79a988" font-size="13" letter-spacing="1.3">BACKEND / DISTRIBUTED SYSTEMS / LINUX / MULTI-RUNTIME ENGINEERING</text><text x="44" y="184" fill="#63ff9e" font-size="12">$ uname -a</text><text x="165" y="184" fill="#9fb7a6" font-size="12">Java · Spring · Python · FastAPI · Node · TypeScript · C++ · Kafka · Redis · K8s · AWS</text><g transform="translate(44 218)"><rect width="704" height="250" rx="10" fill="#030806" stroke="#1b4a30"/><text x="18" y="25" fill="#456957" font-size="10">/var/log/backendarchitectx/session.log</text><text x="18" y="54" fill="#7effa8" font-size="12">[PROD]</text><text x="76" y="54" fill="#d1e7d7" font-size="12">1M+ txns   p95 -40%   throughput +15%   uptime 99.8%   MTTR 35→12m</text><text x="18" y="86" fill="#7ed9ff" font-size="12">[JVM ]</text><text x="76" y="86" fill="#b7cfd1" font-size="12">Spring Boot / concurrency / JFR / REST / Kafka</text><text x="18" y="116" fill="#d78cff" font-size="12">[PY  ]</text><text x="76" y="116" fill="#c8c1d4" font-size="12">FastAPI / Flask / service integration</text><text x="18" y="146" fill="#ffcf70" font-size="12">[WEB ]</text><text x="76" y="146" fill="#d5c8a7" font-size="12">Node / Express / TypeScript / JavaScript / React</text><text x="18" y="176" fill="#ff8f70" font-size="12">[SYS ]</text><text x="76" y="176" fill="#d4b7ae" font-size="12">C++ / STL / JNI / CUDA / native lifecycle</text><text x="18" y="206" fill="#7effa8" font-size="12">[OSS ]</text><text x="76" y="206" fill="#d1e7d7" font-size="12">AutoMQ #3493 MERGED   Trino #30973 REVIEW   Fluss #4263 REVIEW</text><rect x="18" y="224" width="530" height="2" fill="url(#g)"><animate attributeName="width" values="120;650;120" dur="4s" repeatCount="indefinite"/></rect></g><g transform="translate(785 218)"><rect width="370" height="250" rx="10" fill="#040908" stroke="#183c2b"/><text x="18" y="25" fill="#466353" font-size="10">buffer.java / terminal split</text><text x="18" y="58" fill="#6ce7ff" font-size="11">final</text><text x="58" y="58" fill="#e6f4f5" font-size="11">State owner = state.claim();</text><text x="18" y="86" fill="#c084fc" font-size="11">if</text><text x="40" y="86" fill="#d8d0e5" font-size="11"> (!owner.canFinalize()) return;</text><text x="18" y="126" fill="#63ff9e" font-size="11">$ git status --short</text><text x="18" y="151" fill="#9cd4aa" font-size="11">M  lifecycle/ownership.java</text><text x="18" y="176" fill="#9cd4aa" font-size="11">A  test/DeterministicRaceTest.java</text><text x="18" y="216" fill="#63ff9e" font-size="11">$ sudo systemctl status curiosity</text><text x="18" y="238" fill="#d5eadb" font-size="11">● active (running)</text><rect x="332" y="45" width="2" height="18" fill="#63ff9e"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect></g><text x="44" y="520" fill="#3f6a50" font-size="10">root principle: own state · own lifecycle · observe failure · prove races · measure impact</text><path d="M44 538H1156" stroke="url(#g)" stroke-width="1.4" opacity=".7"/><circle r="4" fill="#63ff9e" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M44 538H1156"/></circle></g></svg>