<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Upstream Neural Lattice</title><desc id="d">Animated neural lattice of open-source contributions with holographic merged and review nodes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04050a"/><stop offset="1" stop-color="#090b14"/></linearGradient><linearGradient id="holo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55f7ff"><animate attributeName="stop-color" values="#55f7ff;#8b5cff;#ff4fd8;#72ffb3;#55f7ff" dur="6s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#ff4fd8"><animate attributeName="stop-color" values="#ff4fd8;#72ffb3;#55f7ff;#8b5cff;#ff4fd8" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#72ffb3"/></linearGradient><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="grain"><feTurbulence baseFrequency=".5" numOctaves="1" seed="3" type="fractalNoise" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer></filter><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#59efff" stroke-opacity=".045"/></pattern></defs><rect width="1200" height="460" rx="24" fill="url(#bg)"/><rect width="1200" height="460" rx="24" fill="url(#grid)"/><rect width="1200" height="460" rx="24" fill="#fff" filter="url(#grain)" opacity=".25"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="36" y="42" fill="#6dfcff" font-size="12" letter-spacing="3">UPSTREAM://NEURAL-LATTICE</text><text x="970" y="42" fill="#72ffb3" font-size="11">git status --porcelain=v2</text><text x="36" y="72" fill="#7f929d" font-size="11">signal paths represent engineering boundaries, not repository popularity</text><g stroke="#53eaff" stroke-opacity=".18" fill="none"><path d="M220 240 C360 120 500 130 615 220"/><path d="M220 240 C350 320 480 340 615 220"/><path d="M615 220 C760 105 900 120 1025 190"/><path d="M615 220 C760 310 900 330 1025 280"/><path d="M220 240 C430 230 800 225 1025 190" stroke="#8b5cff" stroke-opacity=".10"/></g><g fill="#fff" filter="url(#glow)"><circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite" path="M220 240 C360 120 500 130 615 220"/></circle><circle r="3.5"><animateMotion dur="4.1s" begin=".8s" repeatCount="indefinite" path="M220 240 C350 320 480 340 615 220"/></circle><circle r="4"><animateMotion dur="3.2s" begin=".4s" repeatCount="indefinite" path="M615 220 C760 105 900 120 1025 190"/></circle><circle r="3.5"><animateMotion dur="3.8s" begin="1.1s" repeatCount="indefinite" path="M615 220 C760 310 900 330 1025 280"/></circle></g><g transform="translate(220 240)"><circle r="64" fill="#72ffb3" opacity=".07"><animate attributeName="r" values="58;72;58" dur="3s" repeatCount="indefinite"/></circle><circle r="50" fill="#080c12" stroke="url(#holo)" stroke-width="3" filter="url(#glow)"/><text text-anchor="middle" y="-8" fill="#72ffb3" font-size="11">MERGED</text><text text-anchor="middle" y="13" fill="#fff" font-size="15" font-weight="700">AutoMQ</text><text text-anchor="middle" y="31" fill="#8ca1ac" font-size="10">#3493</text></g><g transform="translate(615 220)"><circle r="48" fill="#0a0d16" stroke="#8b7cff" stroke-width="2"/><text text-anchor="middle" y="-7" fill="#b2a5ff" font-size="10">REVIEW</text><text text-anchor="middle" y="13" fill="#fff" font-size="14" font-weight="700">Trino</text><text text-anchor="middle" y="30" fill="#7f929d" font-size="10">#30973</text></g><g transform="translate(1025 190)"><circle r="44" fill="#0a0d16" stroke="#55f7ff" stroke-width="2"/><text text-anchor="middle" y="-6" fill="#6dfcff" font-size="10">REVIEW</text><text text-anchor="middle" y="13" fill="#fff" font-size="13" font-weight="700">Fluss</text><text text-anchor="middle" y="29" fill="#7f929d" font-size="10">#4263</text></g><g transform="translate(1025 280)"><circle r="38" fill="#0a0d16" stroke="#ff56cf" stroke-width="1.5"/><text text-anchor="middle" y="-5" fill="#ff75d9" font-size="9">REVIEW</text><text text-anchor="middle" y="12" fill="#fff" font-size="12">AutoMQ</text><text text-anchor="middle" y="27" fill="#7f929d" font-size="9">#3579</text></g><g transform="translate(615 348)"><circle r="35" fill="#0a0d16" stroke="#72ffb3" stroke-width="1.5"/><text text-anchor="middle" y="-4" fill="#72ffb3" font-size="9">REVIEW</text><text text-anchor="middle" y="12" fill="#fff" font-size="12">Fluss</text><text text-anchor="middle" y="27" fill="#7f929d" font-size="9">#4230</text></g><g transform="translate(36 390)"><rect width="1128" height="42" rx="10" fill="#070a11" stroke="#fff" stroke-opacity=".08"/><text x="16" y="18" fill="#72ffb3" font-size="10">+ ownership</text><text x="112" y="18" fill="#55f7ff" font-size="10">+ deterministic-tests</text><text x="278" y="18" fill="#8b7cff" font-size="10">+ endpoint-identity</text><text x="427" y="18" fill="#ff67d5" font-size="10">+ auth-lifecycle</text><text x="559" y="18" fill="#72ffb3" font-size="10">+ metadata-mapping</text><text x="16" y="33" fill="#667985" font-size="9">external validation is weighted above open review; visual hierarchy reflects proof level</text></g></g></svg>