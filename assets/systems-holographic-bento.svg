<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Systems Bento</title><desc id="d">Animated holographic bento dashboard featuring Vortex CUDA, distributed transactions, stack telemetry and engineering principles.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03050a"/><stop offset="1" stop-color="#0a0811"/></linearGradient><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55f7ff"/><stop offset=".35" stop-color="#8a6cff"/><stop offset=".7" stop-color="#ff55cb"/><stop offset="1" stop-color="#72ffb3"><animate attributeName="stop-color" values="#72ffb3;#55f7ff;#8a6cff;#72ffb3" dur="6s" repeatCount="indefinite"/></stop></linearGradient><radialGradient id="g1"><stop offset="0" stop-color="#55f7ff" stop-opacity=".15"/><stop offset="1" stop-color="#55f7ff" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#ff55cb" stop-opacity=".14"/><stop offset="1" stop-color="#ff55cb" stop-opacity="0"/></radialGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="liquid"><feTurbulence type="fractalNoise" baseFrequency=".006 .02" numOctaves="2" seed="7" result="n"><animate attributeName="baseFrequency" values=".006 .02;.012 .014;.006 .02" dur="10s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="8"/></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><rect width="1200" height="620" rx="26" fill="url(#grid)"/><ellipse cx="280" cy="250" rx="300" ry="260" fill="url(#g1)"/><ellipse cx="920" cy="430" rx="320" ry="260" fill="url(#g2)"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="36" y="42" fill="#6dfcff" font-size="12" letter-spacing="3">SYSTEMS://BENTO  •  ORIGINAL WORK / REPRODUCIBLE PROOF</text><g transform="translate(36 76)"><rect width="700" height="300" rx="24" fill="#0a0d16" fill-opacity=".72" stroke="url(#foil)" stroke-opacity=".55"/><text x="24" y="36" fill="#72ffb3" font-size="11">FLAGSHIP / RELEASED</text><text x="24" y="72" fill="#fff" font-size="28" font-weight="800">VORTEX CUDA</text><text x="24" y="98" fill="#7f929d" font-size="11">Spring Boot → Java → JNI → CUDA → GPU-resident exact Top-K</text><g transform="translate(24 126)"><rect width="122" height="58" rx="12" fill="#070a12" stroke="#55f7ff" stroke-opacity=".2"/><text x="12" y="21" fill="#6f818c" font-size="9">P50</text><text x="12" y="43" fill="#55f7ff" font-size="17" font-weight="700">1.67–1.72 ms</text><rect x="136" width="122" height="58" rx="12" fill="#070a12" stroke="#72ffb3" stroke-opacity=".2"/><text x="148" y="21" fill="#6f818c" font-size="9">QPS</text><text x="148" y="43" fill="#72ffb3" font-size="17" font-weight="700">1,641–1,662</text><rect x="272" width="122" height="58" rx="12" fill="#070a12" stroke="#ff55cb" stroke-opacity=".2"/><text x="284" y="21" fill="#6f818c" font-size="9">FP16</text><text x="284" y="43" fill="#ff70d4" font-size="17" font-weight="700">−50% storage</text><rect x="408" width="122" height="58" rx="12" fill="#070a12" stroke="#8a6cff" stroke-opacity=".2"/><text x="420" y="21" fill="#6f818c" font-size="9">RECALL@10</text><text x="420" y="43" fill="#b09cff" font-size="17" font-weight="700">99.6875%</text></g><path d="M24 224 C80 199 116 244 170 216 S278 198 332 222 S440 246 510 204 S610 208 662 192" fill="none" stroke="url(#foil)" stroke-width="2"/><circle r="4" fill="#fff" filter="url(#glow)"><animateMotion dur="4.8s" repeatCount="indefinite" path="M24 224 C80 199 116 244 170 216 S278 198 332 222 S440 246 510 204 S610 208 662 192"/></circle><text x="24" y="266" fill="#70848f" font-size="10">v1.0.0  •  48/48 benchmark matrix  •  M18 smoke validation  •  packaged release</text></g><g transform="translate(760 76)"><rect width="404" height="300" rx="24" fill="#0a0d16" fill-opacity=".72" stroke="#8a6cff" stroke-opacity=".36"/><text x="22" y="36" fill="#b09cff" font-size="11">EDUCATIONAL SYSTEMS MODEL</text><text x="22" y="70" fill="#fff" font-size="22" font-weight="700">DISTRIB-TXN-DB</text><text x="22" y="98" fill="#7f929d" font-size="10">anomaly-first distributed transaction workshop</text><g transform="translate(28 130)" fill="none" stroke="#55f7ff" stroke-opacity=".35"><path d="M0 36H64M92 36H156M184 36H248M276 36H338"/><circle cx="0" cy="36" r="15" fill="#0b1018"/><circle cx="92" cy="36" r="15" fill="#0b1018"/><circle cx="184" cy="36" r="15" fill="#0b1018"/><circle cx="276" cy="36" r="15" fill="#0b1018"/><circle cx="338" cy="36" r="15" fill="#0b1018"/></g><text x="17" y="173" fill="#72ffb3" font-size="9">HLC</text><text x="103" y="173" fill="#55f7ff" font-size="9">MVCC</text><text x="194" y="173" fill="#ff67d5" font-size="9">INTENTS</text><text x="276" y="173" fill="#b09cff" font-size="9">RESTART</text><text x="350" y="173" fill="#72ffb3" font-size="9">SER</text><text x="22" y="218" fill="#82959f" font-size="10">clock uncertainty → read restart</text><text x="22" y="239" fill="#82959f" font-size="10">snapshot isolation → write skew</text><text x="22" y="260" fill="#82959f" font-size="10">conflicts → serializable guards</text><text x="22" y="284" fill="#596c77" font-size="9">scope + AI assistance explicitly documented</text></g><g transform="translate(36 398)"><rect width="360" height="184" rx="22" fill="#090c14" fill-opacity=".68" stroke="#55f7ff" stroke-opacity=".24"/><text x="20" y="30" fill="#6dfcff" font-size="10">RUNTIMES</text><text x="20" y="62" fill="#fff" font-size="14">JAVA / SPRING</text><text x="20" y="87" fill="#55f7ff" font-size="13">PYTHON / FASTAPI / FLASK</text><text x="20" y="112" fill="#b09cff" font-size="13">NODE / TS / JS / REACT</text><text x="20" y="137" fill="#ff67d5" font-size="13">C++ / STL / JNI / CUDA</text><text x="20" y="162" fill="#72ffb3" font-size="12">KAFKA / REDIS / SQL</text><rect x="378" width="360" height="184" rx="22" fill="#090c14" fill-opacity=".68" stroke="#8a6cff" stroke-opacity=".24"/><text x="398" y="30" fill="#b09cff" font-size="10">OPERABILITY</text><text x="398" y="62" fill="#fff" font-size="13">AWS / EKS / KUBERNETES</text><text x="398" y="87" fill="#55f7ff" font-size="13">JENKINS / CI-CD / PCF</text><text x="398" y="112" fill="#72ffb3" font-size="13">CLOUDWATCH / SPLUNK</text><text x="398" y="137" fill="#ff67d5" font-size="13">DYNATRACE / JFR</text><text x="398" y="162" fill="#6f818c" font-size="10">measure → detect → diagnose → recover</text><rect x="756" width="372" height="184" rx="22" fill="#090c14" fill-opacity=".68" stroke="url(#foil)" stroke-opacity=".28"/><text x="776" y="30" fill="#72ffb3" font-size="10">ENGINEERING BIASES</text><text x="776" y="60" fill="#fff" font-size="12">correctness before cleverness</text><text x="776" y="84" fill="#fff" font-size="12">ownership before recovery</text><text x="776" y="108" fill="#fff" font-size="12">idempotency before retry</text><text x="776" y="132" fill="#fff" font-size="12">deterministic races before stress</text><text x="776" y="156" fill="#fff" font-size="12">operability is part of design</text></g></g></svg>