  <filter id="metal" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant="1.1" specularExponent="35" lighting-color="#ffffff" result="s"><fePointLight x="470" y="70" z="180"><animate attributeName="x" values="300;900;300" dur="12s" repeatCount="indefinite"/></fePointLight></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="si"/><feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="1" k2="1" k3="1" k4="0"/></filter>
  <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#94f7ff" stroke-width="1" stroke-opacity=".055"/></pattern>
  <clipPath id="clip"><rect x="0" y="0" width="1200" height="760" rx="28"/></clipPath>
