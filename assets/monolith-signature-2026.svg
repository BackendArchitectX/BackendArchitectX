  <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ffff"/><stop offset=".14" stop-color="#74f7ff"/><stop offset=".31" stop-color="#7868ff"/><stop offset=".48" stop-color="#ff5bc8"/><stop offset=".64" stop-color="#ffd166"/><stop offset=".82" stop-color="#6fffc2"/><stop offset="1" stop-color="#dffcff"/><animate attributeName="x1" values="0;1;0" dur="11s" repeatCount="indefinite"/><animate attributeName="y2" values="1;0;1" dur="13s" repeatCount="indefinite"/></linearGradient>
