<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Pranay Kadu — Backend Architect X</title><desc id="d">Premium spectral monolith hero for a backend and distributed systems engineer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050508"/><stop offset=".48" stop-color="#080a10"/><stop offset="1" stop-color="#030305"/></linearGradient>
