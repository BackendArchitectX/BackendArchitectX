<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#7ee7ff;font-size:18px;font-weight:700}.t{fill:#c8dbe1;font-size:12px}.m{fill:#597b86;font-size:10px}.ok{fill:#70f0b1}.warn{fill:#ffd166}.bad{fill:#ff667d}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.4}.line{stroke:#235663;stroke-width:2}.dash{stroke:#713744;stroke-width:2;stroke-dasharray:5 5}.packet{fill:#7ee7ff;filter:url(#g)}</style><defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="430" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="40" class="h">TRANSACTION STATE MACHINE // OWNERSHIP + LEGAL TRANSITIONS</text><text x="32" y="68" class="m">CONCURRENCY REASONING MODEL // STATE CLAIMS MUST BE MONOTONIC</text><g transform="translate(50 120)"><rect class="box" width="160" height="64" rx="8"/><text x="58" y="38" class="t">OPEN</text><rect class="box" x="255" width="190" height="64" rx="8"/><text x="300" y="38" class="warn">COMMITTING</text><rect class="box" x="545" width="180" height="64" rx="8"/><text x="594" y="38" class="ok">FINISHED</text><path class="line" d="M160 32H255M445 32H545"/><circle r="5" class="packet"><animateMotion dur="3.8s" repeatCount="indefinite" path="M160 32H545"/></circle><rect class="box" x="820" width="180" height="64" rx="8"/><text x="874" y="38" class="bad">FAILED</text><path class="dash" d="M350 64V135H820"/><text x="555" y="128" class="bad">GENUINE COMMIT FAILURE</text><path class="dash" d="M350 64V210H210"/><text x="0" y="214" class="bad">UNRELATED EXTERNAL FAILURE</text><text x="0" y="240" class="m">→ rejected once COMMITTING owns finalization</text><rect class="box" x="520" y="180" width="480" height="90" rx="8"/><text x="544" y="208" class="m">DETERMINISTIC TEST CONTROL</text><text x="544" y="236" class="t">BLOCK COMMIT → inject failure → release commit</text><text x="544" y="260" class="ok">assert terminal state remains legal</text></g><text x="50" y="395" class="m">INVARIANT // terminal-state ownership cannot be stolen by a later unrelated signal</text></svg>