<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Engineering verification matrix</title><desc id="desc">Production, upstream, and reproducible systems evidence separated by validation level.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#86f7ff;font-size:18px;font-weight:700}.t{fill:#c8dbe1;font-size:12px}.m{fill:#5f7d86;font-size:10px}.ok{fill:#70f0b1}.warn{fill:#ffd166}.cyan{fill:#7ee7ff}.box{fill:#07151b;stroke:#245f6e;stroke-width:1.3}.scan{fill:#7ee7ff;opacity:.08}</style><rect width="1200" height="430" rx="16" fill="#050b10" stroke="#173d49"/><text x="32" y="42" class="h">VERIFICATION MATRIX // WHAT IS ACTUALLY PROVEN</text><text x="32" y="68" class="m">PRODUCTION IMPACT ≠ MERGED UPSTREAM ≠ REPRODUCIBLE LAB ≠ EDUCATIONAL MODEL</text><g transform="translate(35 100)"><rect class="box" width="1130" height="82" rx="8"/><text x="18" y="24" class="ok">01 // PRODUCTION IMPACT</text><text x="18" y="50" class="t">1M+ transactions · p95 −40% · throughput +15% · 99.8% uptime · MTTR 35→12 min</text><text x="18" y="70" class="m">SOURCE: professional backend delivery / production operations</text></g><g transform="translate(35 200)"><rect class="box" width="1130" height="82" rx="8"/><text x="18" y="24" class="ok">02 // EXTERNAL OSS VALIDATION</text><text x="18" y="50" class="t">AutoMQ #3493 — maintainer-reviewed, revised, approved, merged</text><text x="610" y="50" class="warn">Trino / Fluss / AutoMQ — under review</text><text x="18" y="70" class="m">RULE: open PRs are not counted as equivalent validation</text></g><g transform="translate(35 300)"><rect class="box" width="720" height="82" rx="8"/><text x="18" y="24" class="cyan">03 // REPRODUCIBLE ORIGINAL SYSTEM</text><text x="18" y="50" class="t">Vortex CUDA v1.0.0 · 48/48 benchmark cases · M18 end-to-end smoke PASS</text><text x="18" y="70" class="m">benchmark methodology + architecture + security + release packaging</text><rect class="box" x="745" width="385" height="82" rx="8"/><text x="763" y="24" fill="#91a7ae" font-size="12">04 // EDUCATIONAL MODEL</text><text x="763" y="50" class="t">distrib-txn-db · HLC / MVCC / intents</text><text x="763" y="70" class="m">teaching scope · AI assistance acknowledged</text></g><rect x="0" y="0" width="65" height="430" class="scan"><animate attributeName="x" values="-65;1200" dur="8s" repeatCount="indefinite"/></rect><text x="35" y="412" class="m">CREDIBILITY POLICY // claim strength must not exceed validation strength</text></svg>