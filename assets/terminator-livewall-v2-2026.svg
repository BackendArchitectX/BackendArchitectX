  <path d="M1020 1003 H1136" stroke="#39FF14" stroke-width="2" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="1.6s" repeatCount="indefinite"/></path>
  <path d="M1020 1075 H1136" stroke="#7CFF4F" stroke-width="2" stroke-dasharray="7 10"><animate attributeName="stroke-dashoffset" values="0;-68" dur="1.35s" repeatCount="indefinite"/></path>
</g>

