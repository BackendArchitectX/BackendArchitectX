  <text x="372" y="772" fill="#F0FFF0" font-size="22">p95 latency</text><text x="540" y="772" fill="#7CFF4F" font-size="27" font-weight="800">-40%</text>
  <text x="690" y="772" fill="#F0FFF0" font-size="22">throughput</text><text x="854" y="772" fill="#7CFF4F" font-size="27" font-weight="800">+15%</text>
  <text x="972" y="772" fill="#F0FFF0" font-size="22">uptime</text><text x="1064" y="772" fill="#7CFF4F" font-size="27" font-weight="800">99.8%</text>
