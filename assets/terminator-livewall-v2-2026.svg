  <text x="58" y="1010" fill="#E7FFE6" font-size="20">spring-api            RUNNING     500+ TPS</text>
  <text x="58" y="1046" fill="#E7FFE6" font-size="20">kafka-consumer        RUNNING     event-driven</text>
  <text x="58" y="1082" fill="#E7FFE6" font-size="20">redis-risk-cache      RUNNING     low-latency</text>
  <text x="58" y="1118" fill="#E7FFE6" font-size="20">k8s-autoscaler        RUNNING     elastic</text>
  <text x="650" y="930" fill="#649C63" font-size="16">$ netstat --live</text>
  <text x="650" y="972" fill="#6FAE6E" font-size="17">SOURCE       → TARGET       STATUS</text>
  <text x="650" y="1010" fill="#E7FFE6" font-size="19">gateway      → spring-api   ESTABLISHED</text>
  <text x="650" y="1046" fill="#E7FFE6" font-size="19">spring-api   → redis        ESTABLISHED</text>
  <text x="650" y="1082" fill="#E7FFE6" font-size="19">spring-api   → kafka        ESTABLISHED</text>
  <text x="650" y="1118" fill="#E7FFE6" font-size="19">metrics      → cloudwatch   STREAMING</text>
  <g fill="#39FF14">
    <circle cx="502" cy="1003" r="5"><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="1039" r="5"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="502" cy="1075" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.25s" repeatCount="indefinite"/></circle>
