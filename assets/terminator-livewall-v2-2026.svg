<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1710" viewBox="0 0 1200 1710" role="img" aria-labelledby="title desc">
<title id="title">Pranay Kadu — Continuous Linux Terminal Profile</title>
<desc id="desc">Continuous animated Linux terminal profile with professional section headings, large bounded typography, live systems signals, open-source work and featured projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010301"/><stop offset=".52" stop-color="#040704"/><stop offset="1" stop-color="#010201"/></linearGradient>
  <radialGradient id="auraA" cx="20%" cy="14%" r="58%"><stop offset="0" stop-color="#39FF14" stop-opacity=".12"/><stop offset="1" stop-color="#39FF14" stop-opacity="0"/></radialGradient>
  <radialGradient id="auraB" cx="82%" cy="72%" r="60%"><stop offset="0" stop-color="#7CFF4F" stop-opacity=".07"/><stop offset="1" stop-color="#7CFF4F" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#39FF14" stroke-opacity=".025"/></pattern>
  <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="1" fill="#7CFF4F" opacity=".018"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1200" height="1710" rx="28" fill="url(#bg)"/>
<rect width="1200" height="1710" rx="28" fill="url(#grid)"/>
<rect width="1200" height="1710" rx="28" fill="url(#scan)"/>
<rect width="1200" height="1710" rx="28" fill="url(#auraA)"/>
<rect width="1200" height="1710" rx="28" fill="url(#auraB)"/>
<rect x="1" y="1" width="1198" height="1708" rx="27" fill="none" stroke="#39FF14" stroke-opacity=".28"/>

<rect x="34" y="62" width="1132" height="74" fill="#39FF14" opacity=".018" filter="url(#soft)"><animate attributeName="y" values="62;1560;62" dur="13s" repeatCount="indefinite"/></rect>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <circle cx="52" cy="42" r="7" fill="#39FF14" opacity=".65"/>
  <circle cx="76" cy="42" r="7" fill="#39FF14" opacity=".28"/>
  <circle cx="100" cy="42" r="7" fill="#39FF14" opacity=".14"/>
  <text x="138" y="49" fill="#6FAE6E" font-size="15">terminator — backendarchitectx@linux : ~/profile</text>
  <text x="930" y="49" fill="#4F7E4E" font-size="14">[tty0] [bash] [online]</text>
</g>
<line x1="32" y1="70" x2="1168" y2="70" stroke="#39FF14" stroke-opacity=".16"/>

<!-- PROFILE OVERVIEW -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="58" y="120" fill="#39FF14" font-size="31" font-weight="800">PROFILE OVERVIEW</text>
  <text x="58" y="154" fill="#649C63" font-size="16">pranay@backendarchitectx:~$ whoami</text>
  <text x="58" y="220" fill="#F0FFF0" font-size="58" font-weight="900">PRANAY KADU</text>
  <text x="58" y="268" fill="#7CFF4F" font-size="28" font-weight="700">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>
  <text x="58" y="310" fill="#A6D5A4" font-size="20">Java-first · concurrency · reliability · performance · open source</text>
</g>

