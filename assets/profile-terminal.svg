<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">Pranay Kadu — BackendArchitectX</title>
  <desc id="desc">Terminal profile: Backend Software Engineer. Java, Spring Boot, distributed systems, AWS, Kafka, SQL and Redis. Build for failure. Measure before optimizing. Preserve the invariant.</desc>
  <defs>
    <clipPath id="window"><rect x="0.5" y="0.5" width="799" height="499" rx="12"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.018"/></pattern>
    <clipPath id="command-neofetch"><rect x="167" y="52" width="67.2" height="22" class="type-neofetch"/></clipPath>
    <clipPath id="command-plan"><rect x="167" y="358" width="92.4" height="22" class="type-plan"/></clipPath>
    <linearGradient id="rack" x1="50" y1="125" x2="227" y2="294" gradientUnits="userSpaceOnUse"><stop stop-color="#7ee787"/><stop offset="1" stop-color="#56d4dd"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .muted { fill: #8b949e; }
    .green { fill: #7ee787; }
    .cyan { fill: #79c0ff; }
    .small { font-size: 12px; }
    .label { fill: #7ee787; font-weight: 700; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .packet { animation: pulse 2.4s ease-in-out infinite; }
    .reveal { animation: reveal .16s linear var(--delay, 0s) both; }
    .type-neofetch { animation: type-neofetch 1.2s steps(8, end) .25s both; }
    .type-plan { animation: type-plan .88s steps(11, end) 3.1s both; }
    .cursor-neofetch { opacity: 0; animation: cursor-neofetch 1.2s steps(8, end) .25s both; }
    .cursor-plan { opacity: 0; animation: cursor-plan .88s steps(11, end) 3.1s both; }
    .flow-down { animation: flow-down 2.6s linear 1.7s infinite both; }
    .flow-up { animation: flow-up 2.6s linear 1.7s infinite both; }
    .flow-bus { animation: flow-bus 2.2s linear 1.7s infinite both; }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes type-neofetch { from { width: 0px; } to { width: 67.2px; } }
    @keyframes type-plan { from { width: 0px; } to { width: 92.4px; } }
    @keyframes cursor-neofetch { 0% { transform: translateX(0); opacity: 1; } 99.9% { transform: translateX(67.2px); opacity: 1; } 100% { transform: translateX(67.2px); opacity: 0; } }
    @keyframes cursor-plan { 0% { transform: translateX(0); opacity: 0; } 1% { opacity: 1; } 99.9% { transform: translateX(92.4px); opacity: 1; } 100% { transform: translateX(92.4px); opacity: 0; } }
    @keyframes flow-down { 0% { transform: translateY(0); opacity: 0; } 12%, 88% { opacity: 1; } 100% { transform: translateY(112px); opacity: 0; } }
    @keyframes flow-up { 0% { transform: translateY(0); opacity: 0; } 12%, 88% { opacity: 1; } 100% { transform: translateY(-112px); opacity: 0; } }
    @keyframes flow-bus { 0% { transform: translateX(0); opacity: 0; } 12%, 88% { opacity: 1; } 100% { transform: translateX(112px); opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .packet, .reveal, .type-neofetch, .type-plan { animation: none; }
      .cursor-neofetch, .cursor-plan, .flow-down, .flow-up, .flow-bus { display: none; }
    }
  </style>
  <g clip-path="url(#window)">
    <rect width="800" height="500" fill="#0d1117"/>
    <rect width="800" height="36" fill="#161b22"/>
    <path d="M0 36H800" stroke="#30363d"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="5.5" fill="#febc2e"/>
    <circle cx="62" cy="18" r="5.5" fill="#28c840"/>
    <text x="400" y="23" text-anchor="middle" class="muted small">pranay@github: ~ — bash</text>

    <text x="24" y="68"><tspan class="green" font-weight="700">pranay@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~</tspan><tspan class="muted">$</tspan></text>
    <text x="167" y="68" textLength="67.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-neofetch)">neofetch</text>
    <rect x="167" y="56" width="8.4" height="15" fill="#7ee787" class="cursor-neofetch"/>

    <!-- Original pixel server motif; decorative, not a system diagram. -->
    <g transform="translate(40 114)" class="reveal" style="--delay:1.5s">
      <path d="M24 46H0V158H24M166 46H190V158H166" stroke="#30363d" stroke-width="2"/>
      <path d="M95 174V194M39 194H151M39 194V205M151 194V205" stroke="#3b6250" stroke-width="2"/>
      <g stroke="url(#rack)" stroke-width="2">
        <rect x="24" y="8" width="142" height="48" rx="5" fill="#111d1c"/>
        <rect x="24" y="67" width="142" height="48" rx="5" fill="#111d1c"/>
        <rect x="24" y="126" width="142" height="48" rx="5" fill="#111d1c"/>
      </g>
      <g fill="#7ee787">
        <rect x="38" y="23" width="9" height="18" rx="1"/><rect x="51" y="23" width="9" height="18" rx="1" opacity="0.55"/>
        <rect x="38" y="82" width="9" height="18" rx="1"/><rect x="51" y="82" width="9" height="18" rx="1" opacity="0.55"/>
        <rect x="38" y="141" width="9" height="18" rx="1"/><rect x="51" y="141" width="9" height="18" rx="1" opacity="0.55"/>
      </g>
      <g stroke="#345b47" stroke-width="2"><path d="M76 27H118M76 35H107M76 86H118M76 94H107M76 145H118M76 153H107"/></g>
      <g fill="#56d4dd" class="packet"><rect x="140" y="28" width="8" height="8" rx="1"/><rect x="140" y="87" width="8" height="8" rx="1"/><rect x="140" y="146" width="8" height="8" rx="1"/></g>
      <g fill="#7ee787"><circle cx="0" cy="46" r="3" class="flow-down"/><circle cx="39" cy="194" r="3" class="flow-bus"/></g>
      <circle cx="190" cy="158" r="3" fill="#56d4dd" class="flow-up"/>
      <rect x="29" y="205" width="20" height="8" rx="1" fill="#7ee787"/><rect x="141" y="205" width="20" height="8" rx="1" fill="#56d4dd"/>
      <text x="95" y="241" text-anchor="middle" class="muted small">&lt; BackendArchitectX /&gt;</text>
    </g>

    <text style="--delay:1.55s" class="reveal green" x="274" y="102" font-weight="700">pranay@BackendArchitectX</text>
    <text style="--delay:1.6s" class="reveal muted" x="274" y="122">───────────────────────</text>
    <text style="--delay:1.7s" class="reveal" x="274" y="148"><tspan class="label">Name:</tspan><tspan x="350">Pranay Kadu</tspan></text>
    <text style="--delay:1.82s" class="reveal" x="274" y="170"><tspan class="label">Role:</tspan><tspan x="350">Backend Software Engineer</tspan></text>
    <text style="--delay:1.94s" class="reveal" x="274" y="192"><tspan class="label">Kernel:</tspan><tspan x="350">Java 8 / 11 / 17 · Spring Boot</tspan></text>
    <text style="--delay:2.06s" class="reveal" x="274" y="214"><tspan class="label">Arch:</tspan><tspan x="350">Distributed Systems · Microservices</tspan></text>
    <text style="--delay:2.18s" class="reveal" x="274" y="236"><tspan class="label">Cloud:</tspan><tspan x="350">AWS · Docker · Kubernetes</tspan></text>
    <text style="--delay:2.3s" class="reveal" x="274" y="258"><tspan class="label">Queue:</tspan><tspan x="350">Kafka · IBM MQ · RabbitMQ</tspan></text>
    <text style="--delay:2.42s" class="reveal" x="274" y="280"><tspan class="label">Data:</tspan><tspan x="350">SQL · Redis</tspan></text>
    <text style="--delay:2.54s" class="reveal" x="274" y="302"><tspan class="label">Web:</tspan><tspan x="350">backendarchitectx.github.io</tspan></text>
    <g transform="translate(274 320)" class="reveal" style="--delay:2.66s">
      <rect width="25" height="13" fill="#ff7b72"/><rect x="25" width="25" height="13" fill="#ffa657"/><rect x="50" width="25" height="13" fill="#e3b341"/><rect x="75" width="25" height="13" fill="#7ee787"/><rect x="100" width="25" height="13" fill="#56d4dd"/><rect x="125" width="25" height="13" fill="#79c0ff"/><rect x="150" width="25" height="13" fill="#d2a8ff"/><rect x="175" width="25" height="13" fill="#e6edf3"/>
    </g>

    <text x="24" y="374" class="reveal" style="--delay:3s"><tspan class="green" font-weight="700">pranay@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~</tspan><tspan class="muted">$</tspan></text>
    <text x="167" y="374" textLength="92.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-plan)">cat ~/.plan</text>
    <rect x="167" y="362" width="8.4" height="15" fill="#7ee787" class="cursor-plan"/>
    <text x="24" y="397" class="reveal" style="--delay:4.15s"><tspan class="green">[x]</tspan><tspan x="58">build reliable backends</tspan></text>
    <text x="24" y="418" class="reveal" style="--delay:4.35s"><tspan class="green">[x]</tspan><tspan x="58">measure performance · preserve correctness</tspan></text>
    <text x="24" y="439" class="reveal" style="--delay:4.55s"><tspan class="cyan">[~]</tspan><tspan x="58">contribute upstream · learn in public</tspan></text>
    <g class="reveal" style="--delay:4.9s">
      <text x="24" y="478"><tspan class="green" font-weight="700">pranay@github</tspan><tspan class="muted">:</tspan><tspan class="cyan">~</tspan><tspan class="muted">$</tspan></text>
      <rect x="167" y="466" width="8.4" height="15" fill="#7ee787" class="cursor"/>
    </g>
    <rect y="36" width="800" height="464" fill="url(#scan)" pointer-events="none"/>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="12" stroke="#30363d"/>
</svg>
