      <text x="480" y="132" font-size="30" font-weight="700" fill="#f4f8ff">48/48</text><text x="480" y="153" font-size="9" fill="#718497">BENCHMARK CASES</text>
      <path d="M24 181 C100 171 125 188 180 169 S278 186 332 160 S425 180 492 152 S595 166 700 140" fill="none" stroke="url(#edge)" stroke-width="2"/><circle r="4.2" fill="#7ff8db" filter="url(#glow)"><animateMotion dur="4.4s" repeatCount="indefinite" path="M24 181 C100 171 125 188 180 169 S278 186 332 160 S425 180 492 152 S595 166 700 140"/></circle>
    </g>

    <g transform="translate(800 310)">
      <rect width="360" height="205" rx="24" fill="url(#glass)" stroke="#61dfb5" stroke-opacity=".28"/>
