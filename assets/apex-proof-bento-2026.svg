      <text x="24" y="74" font-size="36" font-weight="700" fill="#f7fbff">1M+</text><text x="24" y="94" font-size="9" fill="#738696">TRANSACTIONS</text>
      <text x="190" y="74" font-size="36" font-weight="700" fill="#7ff0cd">99.8%</text><text x="190" y="94" font-size="9" fill="#738696">UPTIME</text>
      <text x="24" y="145" font-size="29" font-weight="700" fill="#f7fbff">35 → 12 min</text><text x="24" y="167" font-size="9" fill="#738696">MTTR</text>
      <rect x="190" y="125" width="132" height="42" rx="21" fill="#0d201b" stroke="#58e4b0" stroke-opacity=".25"/><text x="213" y="151" font-size="11" font-weight="700" fill="#78ecc0">p95 -40%</text>
