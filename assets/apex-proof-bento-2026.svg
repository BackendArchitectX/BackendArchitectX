        <path d="M187 12H213" stroke="#707d93"/><circle cx="217" cy="12" r="6" fill="#6fffcf"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
      </g>
