      <text x="24" y="72" font-size="26" font-weight="700" fill="#f6fbff">AutoMQ #3493</text>
      <text x="24" y="99" font-size="12" fill="#8da0b2">controller-only reporter lifecycle</text>
      <rect x="24" y="125" width="150" height="24" rx="12" fill="#0d251d" stroke="#54e5ad" stroke-opacity=".35"/><text x="40" y="142" font-size="10" font-weight="700" fill="#77f0c0">MERGED / REVIEWED</text>
      <text x="24" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7f91a2">+ ConfigDef LIST parsing</text>
      <text x="270" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7f91a2">+ lifecycle regression</text>
