<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Pranay Kadu — Backend and Distributed Systems Engineer</title>
  <desc id="desc">A restrained editorial masthead highlighting Pranay Kadu's backend systems focus and selected production outcomes.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B0E"/>
      <stop offset=".58" stop-color="#0D1014"/>
      <stop offset="1" stop-color="#11161A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38C97B"/>
      <stop offset=".65" stop-color="#38C97B" stop-opacity=".3"/>
      <stop offset="1" stop-color="#38C97B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".55" fill="#FFFFFF" opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1199" height="459" fill="none" stroke="#272D33"/>
  <rect width="1200" height="460" fill="url(#grain)"/>

  <!-- Editorial registration marks -->
  <rect x="48" y="40" width="8" height="8" fill="#38C97B"/>
  <text x="72" y="49" fill="#89939D" font-size="12" font-weight="650" letter-spacing="2.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ENGINEERING PROFILE / 2026</text>
  <text x="1148" y="49" text-anchor="end" fill="#626C76" font-size="11" letter-spacing="1.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BACKENDARCHITECTX</text>
  <line x1="48" y1="72" x2="1152" y2="72" stroke="#292F35"/>

  <!-- Identity -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="48" y="158" fill="#F4F6F8" font-size="68" font-weight="760" letter-spacing="-2.2">Pranay Kadu</text>
    <text x="50" y="202" fill="#C4CBD2" font-size="23" font-weight="560" letter-spacing="-.2">Backend &amp; Distributed Systems Engineer</text>
    <rect x="49" y="237" width="3" height="76" fill="#38C97B"/>
    <text x="72" y="258" fill="#A5AEB7" font-size="17">I build transaction-heavy services where concurrency, failure handling</text>
    <text x="72" y="285" fill="#A5AEB7" font-size="17">and operability are first-class design constraints.</text>
    <text x="72" y="320" fill="#6F7983" font-size="14">Java · Spring Boot · Kafka · Redis · SQL · Kubernetes · AWS</text>
  </g>

  <!-- Evidence ledger -->
  <line x1="744" y1="104" x2="744" y2="344" stroke="#2C333A"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="784" y="123" fill="#68727C" font-size="10" font-weight="700" letter-spacing="2">SELECTED PRODUCTION OUTCOMES</text>

    <text x="784" y="174" fill="#38C97B" font-size="11" font-weight="700">01</text>
    <text x="824" y="174" fill="#F0F3F5" font-size="26" font-weight="700">1M+</text>
    <text x="911" y="174" fill="#89939D" font-size="13">transactions processed</text>
    <line x1="784" y1="193" x2="1152" y2="193" stroke="#252B31"/>

    <text x="784" y="230" fill="#38C97B" font-size="11" font-weight="700">02</text>
    <text x="824" y="230" fill="#F0F3F5" font-size="26" font-weight="700">−40%</text>
    <text x="927" y="230" fill="#89939D" font-size="13">p95 latency</text>
    <line x1="784" y1="249" x2="1152" y2="249" stroke="#252B31"/>

    <text x="784" y="286" fill="#38C97B" font-size="11" font-weight="700">03</text>
    <text x="824" y="286" fill="#F0F3F5" font-size="26" font-weight="700">500+</text>
    <text x="927" y="286" fill="#89939D" font-size="13">transactions / second</text>
    <line x1="784" y1="305" x2="1152" y2="305" stroke="#252B31"/>

    <text x="784" y="342" fill="#38C97B" font-size="11" font-weight="700">04</text>
    <text x="824" y="342" fill="#F0F3F5" font-size="26" font-weight="700">35 → 12m</text>
    <text x="1001" y="342" fill="#89939D" font-size="13">MTTR</text>
  </g>

  <!-- Footer statement -->
  <line x1="48" y1="382" x2="1152" y2="382" stroke="#292F35"/>
  <rect x="48" y="407" width="206" height="2" fill="url(#rule)"/>
  <text x="48" y="431" fill="#8D97A1" font-size="11" font-weight="650" letter-spacing="1.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CORRECTNESS / OWNERSHIP / OPERABILITY</text>
  <text x="1152" y="431" text-anchor="end" fill="#66717B" font-size="11" letter-spacing="1.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DESIGN → VALIDATE → OPERATE</text>
</svg>
