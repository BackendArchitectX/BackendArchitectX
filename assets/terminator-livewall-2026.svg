<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1580" viewBox="0 0 1200 1580" role="img" aria-labelledby="title desc">
<title id="title">Pranay Kadu — Continuous Terminator Linux Live Wall</title>
<desc id="desc">A continuous animated green-on-black Linux terminal profile with large bounded text, live process signals, open-source proof and systems projects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#010301"/>
    <stop offset=".5" stop-color="#040704"/>
    <stop offset="1" stop-color="#010201"/>
  </linearGradient>
  <radialGradient id="glowA" cx="18%" cy="16%" r="60%">
    <stop offset="0" stop-color="#39FF14" stop-opacity=".12"/>
    <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="82%" cy="78%" r="62%">
    <stop offset="0" stop-color="#7CFF4F" stop-opacity=".08"/>
    <stop offset="1" stop-color="#7CFF4F" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#39FF14" stroke-opacity=".025"/>
  </pattern>
  <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse">
    <rect width="5" height="1" fill="#7CFF4F" opacity=".018"/>
  </pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
  </filter>
</defs>

<rect width="1200" height="1580" rx="28" fill="url(#bg)"/>
<rect width="1200" height="1580" rx="28" fill="url(#grid)"/>
<rect width="1200" height="1580" rx="28" fill="url(#scan)"/>
<rect width="1200" height="1580" rx="28" fill="url(#glowA)"/>
<rect width="1200" height="1580" rx="28" fill="url(#glowB)"/>
<rect width="1200" height="1580" rx="28" filter="url(#grain)" opacity=".18"/>
<rect x="1" y="1" width="1198" height="1578" rx="27" fill="none" stroke="#39FF14" stroke-opacity=".28"/>

<!-- moving vertical scan beam -->
<rect x="36" y="56" width="1128" height="80" fill="#39FF14" opacity=".018" filter="url(#soft)">
  <animate attributeName="y" values="56;1440;56" dur="12s" repeatCount="indefinite"/>
</rect>

<!-- top chrome -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <circle cx="52" cy="42" r="7" fill="#39FF14" opacity=".65"/>
  <circle cx="76" cy="42" r="7" fill="#39FF14" opacity=".28"/>
  <circle cx="100" cy="42" r="7" fill="#39FF14" opacity=".14"/>
  <text x="138" y="49" fill="#6FAE6E" font-size="15">terminator — backendarchitectx@linux : ~/profile</text>
  <text x="930" y="49" fill="#4F7E4E" font-size="14">[tty0] [bash] [online]</text>
</g>
<line x1="32" y1="70" x2="1168" y2="70" stroke="#39FF14" stroke-opacity=".16"/>

<!-- identity -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="58" y="122" fill="#39FF14" font-size="24" font-weight="700">pranay@backendarchitectx:~$ whoami</text>
  <text x="58" y="196" fill="#F0FFF0" font-size="58" font-weight="900">PRANAY KADU</text>
  <text x="58" y="244" fill="#7CFF4F" font-size="27" font-weight="700">BACKEND &amp; DISTRIBUTED SYSTEMS ENGINEER</text>
  <text x="58" y="286" fill="#A6D5A4" font-size="20">Java-first · production systems · concurrency · reliability · open source</text>
  <text x="58" y="330" fill="#39FF14" font-size="22">pranay@backendarchitectx:~$ cat /etc/core-stack</text>
  <text x="58" y="380" fill="#E5FFE4" font-size="30" font-weight="800">JAVA · SPRING BOOT · DISTRIBUTED SYSTEMS</text>
  <text x="58" y="424" fill="#7CFF4F" font-size="26" font-weight="800">KAFKA · REDIS · SQL · KUBERNETES · AWS / EKS</text>
  <text x="58" y="462" fill="#A8D6A7" font-size="21">Python · FastAPI · Flask · Node.js · TypeScript · C++ · Docker · Jenkins</text>
</g>

<!-- blinking cursor -->
<rect x="1082" y="440" width="16" height="26" fill="#39FF14">
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.5;.92;1" dur="1.1s" repeatCount="indefinite"/>
</rect>

<!-- live signal rail -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <line x1="58" y1="510" x2="1142" y2="510" stroke="#39FF14" stroke-opacity=".14"/>
  <circle cx="58" cy="510" r="5" fill="#B6FF00" filter="url(#glow)">
    <animate attributeName="cx" values="58;1142;58" dur="7.5s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="554" fill="#39FF14" font-size="23" font-weight="700">&gt;_ /proc/impact</text>
  <text x="58" y="602" fill="#F0FFF0" font-size="22">transactions</text>
  <text x="250" y="602" fill="#7CFF4F" font-size="25" font-weight="800">1M+</text>
  <text x="390" y="602" fill="#F0FFF0" font-size="22">p95</text>
  <text x="474" y="602" fill="#7CFF4F" font-size="25" font-weight="800">-40%</text>
  <text x="622" y="602" fill="#F0FFF0" font-size="22">throughput</text>
  <text x="796" y="602" fill="#7CFF4F" font-size="25" font-weight="800">+15%</text>
  <text x="928" y="602" fill="#F0FFF0" font-size="22">uptime</text>
  <text x="1036" y="602" fill="#7CFF4F" font-size="25" font-weight="800">99.8%</text>
  <text x="58" y="642" fill="#8FBD8E" font-size="19">MTTR 35m → 12m · production telemetry · failure recovery · RCA ownership</text>
</g>

<!-- live process window -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="58" y="708" fill="#39FF14" font-size="23" font-weight="700">&gt;_ ps --forest --systems</text>
  <text x="58" y="754" fill="#6FAE6E" font-size="18">PID   SERVICE             STATE      SIGNAL</text>
  <text x="58" y="794" fill="#DFFFFD" font-size="20">412   spring-api          RUNNING    500+ TPS</text>
  <text x="58" y="830" fill="#DFFFFD" font-size="20">433   kafka-consumer      RUNNING    event-driven</text>
  <text x="58" y="866" fill="#DFFFFD" font-size="20">455   redis-risk-cache    RUNNING    low-latency</text>
  <text x="58" y="902" fill="#DFFFFD" font-size="20">488   k8s-autoscaler      RUNNING    elastic</text>
  <text x="58" y="938" fill="#DFFFFD" font-size="20">509   cloudwatch-agent    RUNNING    observable</text>
  <g fill="#39FF14">
    <circle cx="520" cy="787" r="5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="823" r="5"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="859" r="5"><animate attributeName="opacity" values=".4;1;.4" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="690" y="708" fill="#39FF14" font-size="23" font-weight="700">&gt;_ netstat --live</text>
  <text x="690" y="754" fill="#6FAE6E" font-size="18">SOURCE        → TARGET        STATUS</text>
  <text x="690" y="794" fill="#DFFFFD" font-size="19">api-gateway   → spring-api    ESTABLISHED</text>
  <text x="690" y="830" fill="#DFFFFD" font-size="19">spring-api    → redis         ESTABLISHED</text>
  <text x="690" y="866" fill="#DFFFFD" font-size="19">spring-api    → kafka         ESTABLISHED</text>
  <text x="690" y="902" fill="#DFFFFD" font-size="19">spring-api    → mysql         ESTABLISHED</text>
  <text x="690" y="938" fill="#DFFFFD" font-size="19">metrics       → cloudwatch    STREAMING</text>
  <path d="M1040 782 H1135" stroke="#39FF14" stroke-width="2" stroke-dasharray="7 10">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M1040 854 H1135" stroke="#7CFF4F" stroke-width="2" stroke-dasharray="7 10">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="1.5s" repeatCount="indefinite"/>
  </path>
</g>

<line x1="58" y1="984" x2="1142" y2="984" stroke="#39FF14" stroke-opacity=".14"/>

<!-- upstream -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="58" y="1032" fill="#39FF14" font-size="23" font-weight="700">&gt;_ git log --oneline upstream</text>
  <text x="58" y="1078" fill="#B6FF00" font-size="21" font-weight="700">MERGED  AutoMQ #3493</text>
  <text x="330" y="1078" fill="#DFFFFD" font-size="19">controller-only reporter lifecycle</text>
  <text x="58" y="1116" fill="#7CFF4F" font-size="20">REVIEW  Trino  #30973</text>
  <text x="330" y="1116" fill="#DFFFFD" font-size="19">finalization ownership</text>
  <text x="58" y="1154" fill="#7CFF4F" font-size="20">REVIEW  Fluss  #4263</text>
  <text x="330" y="1154" fill="#DFFFFD" font-size="19">logical UID / physical endpoint identity</text>
  <text x="58" y="1192" fill="#7CFF4F" font-size="20">REVIEW  AutoMQ #3579</text>
  <text x="330" y="1192" fill="#DFFFFD" font-size="19">Prometheus authentication lifecycle</text>
  <text x="58" y="1230" fill="#7CFF4F" font-size="20">REVIEW  Fluss  #4230</text>
  <text x="330" y="1230" fill="#DFFFFD" font-size="19">Paimon metadata path mapping</text>
</g>

<!-- systems -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="690" y="1032" fill="#39FF14" font-size="23" font-weight="700">&gt;_ tree ~/systems -L 2</text>
  <text x="690" y="1078" fill="#F0FFF0" font-size="22" font-weight="700">Vortex-CUDA</text>
  <text x="716" y="1116" fill="#A7D6A6" font-size="18">Spring Boot → Java → JNI → CUDA</text>
  <text x="716" y="1150" fill="#A7D6A6" font-size="18">GPU-resident exact Top-K</text>
  <text x="716" y="1184" fill="#7CFF4F" font-size="18">v1.0.0 · 48/48 · M18 smoke</text>
  <text x="690" y="1230" fill="#F0FFF0" font-size="22" font-weight="700">distrib-txn-db</text>
  <text x="716" y="1268" fill="#A7D6A6" font-size="18">HLC · MVCC · intents · uncertainty</text>
  <text x="716" y="1302" fill="#A7D6A6" font-size="18">read restart · serializable guards</text>
</g>

<line x1="58" y1="1340" x2="1142" y2="1340" stroke="#39FF14" stroke-opacity=".14"/>

<!-- engineering mode -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <text x="58" y="1388" fill="#39FF14" font-size="23" font-weight="700">&gt;_ engineering.mode</text>
  <text x="58" y="1434" fill="#F0FFF0" font-size="21">correctness  &gt; cleverness</text>
  <text x="390" y="1434" fill="#F0FFF0" font-size="21">ownership &gt; implicit lifecycle</text>
  <text x="790" y="1434" fill="#F0FFF0" font-size="21">idempotency &gt; blind retry</text>
  <text x="58" y="1474" fill="#A8D6A7" font-size="19">observe → isolate → model → change → prove → measure → operate</text>
  <text x="58" y="1524" fill="#39FF14" font-size="20">pranay@backendarchitectx:~$</text>
  <rect x="340" y="1505" width="15" height="24" fill="#39FF14">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.42;.5;.92;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="950" y="1524" fill="#5F925E" font-size="16">session active</text>
</g>

<!-- subtle CRT flicker -->
<rect width="1200" height="1580" rx="28" fill="#39FF14" opacity="0">
  <animate attributeName="opacity" values="0;0;.012;0;0;.008;0" dur="5.2s" repeatCount="indefinite"/>
</rect>
</svg>