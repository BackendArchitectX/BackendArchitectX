            <rect x="67" y="48" width="94" height="52" rx="14" fill="#000000" stroke="#6c5741" stroke-width="1"/>
            <g class="robot-motion bot-eyes" fill="#c4efce"><rect x="82" y="65" width="18" height="11" rx="4"/><rect x="128" y="65" width="18" height="11" rx="4"/></g>
