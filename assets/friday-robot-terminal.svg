            <rect x="47" y="62" width="12" height="25" rx="5" fill="#1c1712" stroke="#b58d65" stroke-width="1.5"/><rect x="169" y="62" width="12" height="25" rx="5" fill="#1c1712" stroke="#b58d65" stroke-width="1.5"/>
