<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="friday-robot-title friday-robot-description">
  <title id="friday-robot-title">Pranay Kadu — FRIDAY robot terminal</title>
  <desc id="friday-robot-description">BackendArchitectX. Backend Software Engineer working with Java, Spring Boot, Distributed Systems and AWS. On a black background, an amber robot rapidly types on a keyboard, bobs its head and shuffles its feet. A terminal illustrates Maven, Docker and Git commands, with a small FRIDAY waveform beneath the robot. Build for failure. Preserve the invariant.</desc>
  <defs>
    <clipPath id="friday-frame"><rect x=".5" y=".5" width="1119" height="649" rx="18"/></clipPath>
    <clipPath id="term-command-clip"><rect class="term-motion term-reveal" x="86" y="425" width="578" height="48"/></clipPath>
    <linearGradient id="bot-metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#332a20"/><stop offset=".55" stop-color="#12100d"/><stop offset="1" stop-color="#000000"/></linearGradient>
  </defs>
  <style>
  text { font-family: 'Segoe UI', Arial, sans-serif; fill: #f1e8df; }
  .mono { font-family: 'DejaVu Sans Mono', 'Liberation Mono', Consolas, monospace; }
  .brand, .edition { font-size: 18px; fill: #b4b0ab; }
  .edition { letter-spacing: 1.5px; }
  .kicker { font-size: 18px; fill: #e8ba8c; letter-spacing: 2px; }
  .name { font-size: 68px; font-weight: 500; letter-spacing: -2.4px; }
  .role { font-size: 24px; }
  .stack { font-size: 20px; fill: #b4b0ab; }
  .stack-mobile { display: none; }
  .footer { font-size: 18px; fill: #b4b0ab; }
  .term-title { font-size: 17px; fill: #aca8a2; }
  .term-command { font-size: 20px; fill: #eee9e3; }
  .term-comment, .term-output { font-size: 19px; fill: #a9a59e; }
  .term-comment { fill: #bd9974; }
  .term-prompt { fill: #e8ba8c; }
  .term-ready { font-size: 18px; fill: #afc2b8; }
  .term-one { opacity: 1; animation: term-one 6s steps(1, end) infinite; }
  .term-two { opacity: 0; animation: term-two 6s steps(1, end) infinite; }
  .term-three { opacity: 0; animation: term-three 6s steps(1, end) infinite; }
  .term-reveal { animation: term-reveal 2s linear infinite; }
  .term-cursor { animation: term-cursor .6s steps(1, end) infinite; }
  .bot-travel { animation: bot-travel 1.2s ease-in-out infinite; }
  .bot-hop { animation: bot-hop .4s ease-in-out infinite; }
  .bot-head { transform-origin: 114px 77px; animation: bot-head .8s ease-in-out infinite; }
  .bot-left-arm { transform-origin: 71px 140px; animation: bot-left-arm .22s ease-in-out infinite; }
  .bot-right-arm { transform-origin: 160px 140px; animation: bot-right-arm .22s ease-in-out infinite; }
  .bot-left-leg { animation: bot-left-leg .32s ease-in-out infinite; }
  .bot-right-leg { animation: bot-right-leg .32s ease-in-out infinite; }
  .bot-eyes { transform-origin: 114px 77px; animation: bot-eyes 2.4s ease-in-out infinite; }
  .fri-bars path { transform-origin: 330px 75px; animation: fri-amplitude 3.7s ease-in-out infinite; animation-delay: var(--fri-delay); }
  .fri-wave-front { transform-origin: 330px 75px; animation: fri-front 5s ease-in-out infinite; }
  .fri-wave-back { transform-origin: 330px 75px; animation: fri-back 7s ease-in-out infinite; }
  .fri-travel { animation: fri-travel 6s linear infinite; }
  @keyframes term-one { 0%, 33.32% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
  @keyframes term-two { 0%, 33.32% { opacity: 0; } 33.33%, 66.65% { opacity: 1; } 66.66%, 100% { opacity: 0; } }
  @keyframes term-three { 0%, 66.65% { opacity: 0; } 66.66%, 100% { opacity: 1; } }
  @keyframes term-reveal { 0% { width: 0px; } 34%, 96%, 100% { width: 578px; } }
  @keyframes term-cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes bot-travel { 0%, 100% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  @keyframes bot-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes bot-head { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(2deg); } }
  @keyframes bot-left-arm { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg); } }
  @keyframes bot-right-arm { 0%, 100% { transform: rotate(7deg); } 50% { transform: rotate(-8deg); } }
  @keyframes bot-left-leg { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes bot-right-leg { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(0); } }
  @keyframes bot-eyes { 0%, 41%, 48%, 100% { transform: scaleY(1); } 44%, 45% { transform: scaleY(.14); } }
  @keyframes fri-amplitude { 0%, 100% { transform: scaleY(var(--fri-scale)); opacity: .3; } 50% { transform: scaleY(.9); opacity: .8; } }
  @keyframes fri-front { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(.95); } }
  @keyframes fri-back { 0%, 100% { transform: scaleY(-.8); } 50% { transform: scaleY(-.4); } }
  @keyframes fri-travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @media (max-width: 600px) {
    .brand { font-size: 40px; }
    .edition, .kicker, .stack-desktop, .portfolio, .term-title { display: none; }
    .name { font-size: 92px; letter-spacing: -3px; transform: translateY(-55px); }
    .role { font-size: 40px; transform: translateY(-49px); }
    .stack-mobile { display: inline; font-size: 40px; transform: translateY(-58px); }
    .footer { font-size: 40px; }
    .term-command { font-size: 36px; }
    .term-comment, .term-output, .term-ready { font-size: 29px; }
    .term-cursor { transform: translateX(130px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .robot-motion, .term-motion, .fri-motion { animation: none !important; }
    .term-one { opacity: 1; } .term-two, .term-three { opacity: 0; }
    .term-reveal { width: 578px; }
    .fri-bars path { transform: scaleY(.6); opacity: .55; }
    .fri-wave-front { transform: scaleY(.65); }
    .fri-wave-back { transform: scaleY(-.55); }
    .fri-travel { opacity: 0; }
  }
</style>
  <g clip-path="url(#friday-frame)">
    <rect id="profile-background" width="1120" height="650" fill="#000000"/>
    <path d="M42 81H1078M42 598H1078" fill="none" stroke="#333333" stroke-width="1.4"/>
    <text class="mono brand" x="42" y="49">BackendArchitectX</text>
    <text class="mono edition" x="1078" y="49" text-anchor="end">F.R.I.D.A.Y. / ROBOT TERMINAL</text>
    <text class="mono kicker" x="42" y="154">THOUGHTFUL CODE. RELIABLE SYSTEMS.</text>
    <text class="name" x="42" y="236">Pranay Kadu<tspan fill="#e8ba8c">.</tspan></text>
    <text class="role" x="42" y="285">Backend Software Engineer</text>
    <text class="mono stack stack-desktop" x="42" y="324">Java · Spring Boot · Distributed Systems · AWS</text>
    <text class="mono stack stack-mobile" x="42" y="344">Java · Spring Boot</text>
    <text class="mono stack stack-mobile" x="42" y="394">Distributed Systems · AWS</text>

    <g id="robot-terminal">
      <rect x="42" y="354" width="665" height="219" rx="11" fill="#000000" stroke="#45413b" stroke-width="1.4"/>
      <path d="M42 390H707" stroke="#292929" stroke-width="1.1"/>
      <g fill="#9d7955"><circle cx="62" cy="373" r="4"/><circle cx="78" cy="373" r="4" opacity=".65"/><circle cx="94" cy="373" r="4" opacity=".35"/></g>
      <text class="mono term-title" x="374" y="379" text-anchor="middle">pranay@github:~/backend</text>
      <text class="mono term-comment" x="66" y="419"># build. ship. repeat.</text>
      <text class="mono term-command term-prompt" x="66" y="455">$</text>
      <g class="term-motion term-one">
        <text class="mono term-command" x="86" y="455" clip-path="url(#term-command-clip)">./mvnw clean package</text>
        <text class="mono term-output" x="66" y="494">&gt; compile · test · package</text>
      </g>
      <g class="term-motion term-two">
        <text class="mono term-command" x="86" y="455" clip-path="url(#term-command-clip)">docker compose up -d</text>
        <text class="mono term-output" x="66" y="494">&gt; services · events · storage</text>
      </g>
      <g class="term-motion term-three">
        <text class="mono term-command" x="86" y="455" clip-path="url(#term-command-clip)">git push origin main</text>
        <text class="mono term-output" x="66" y="494">&gt; ship · learn · improve</text>
      </g>
      <text class="mono term-ready" x="66" y="548">backendarchitectx &gt;</text>
      <rect class="term-motion term-cursor" x="285" y="532" width="10" height="19" rx="1" fill="#bce8cc"/>
    </g>

    <g xmlns="http://www.w3.org/2000/svg" class="friday-wave-mini" transform="translate(772 526) scale(.45)">
              <defs><linearGradient id="fri-wave"><stop stop-color="#db8c60" stop-opacity="0" /><stop offset=".25" stop-color="#e4ab7c" stop-opacity=".5" /><stop offset=".5" stop-color="#ffe0af" /><stop offset=".75" stop-color="#e4ab7c" stop-opacity=".5" /><stop offset="1" stop-color="#db8c60" stop-opacity="0" /></linearGradient><radialGradient id="fri-aura"><stop stop-color="#dc9861" stop-opacity=".14" /><stop offset="1" stop-color="#dc9861" stop-opacity="0" /></radialGradient><filter id="fri-glow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="3" /></filter></defs>
              <ellipse cx="330" cy="75" rx="300" ry="74" fill="url(#fri-aura)" opacity="0" />
              <g stroke="#777777" stroke-opacity=".22" stroke-width=".7"><path d="M20 75H640M20 35H640M20 115H640" /><path d="M90 20V130M210 20V130M330 10V140M450 20V130M570 20V130" /></g>
              <g fill="none" stroke="url(#fri-wave)" stroke-linecap="round">
                <path class="fri-motion fri-wave-back" d="M10 75C60 75 65 65 95 75S130 101 153 75S181 28 205 75S233 130 254 75S282 8 303 75S331 146 352 75S381 13 402 75S430 120 452 75S480 46 503 75S537 92 562 75S608 75 650 75" stroke-width="1" stroke-opacity=".5" />
                <path class="fri-motion fri-wave-front" d="M10 75C60 75 65 65 95 75S130 101 153 75S181 28 205 75S233 130 254 75S282 8 303 75S331 146 352 75S381 13 402 75S430 120 452 75S480 46 503 75S537 92 562 75S608 75 650 75" stroke-width="1.7" />
                <path d="M20 75H640" stroke-width="1" />
              </g>
              <g class="fri-bars" stroke="#edbd8d" stroke-width="2" stroke-linecap="round">
                <path class="fri-motion" style="--fri-delay:-.2s;--fri-scale:.3" d="M198 66V84" /><path class="fri-motion" style="--fri-delay:-.5s;--fri-scale:.6" d="M210 59V91" /><path class="fri-motion" style="--fri-delay:-.8s;--fri-scale:.2" d="M222 48V102" /><path class="fri-motion" style="--fri-delay:-1.1s;--fri-scale:.5" d="M234 55V95" /><path class="fri-motion" style="--fri-delay:-1.4s;--fri-scale:.3" d="M246 35V115" /><path class="fri-motion" style="--fri-delay:-1.7s;--fri-scale:.5" d="M258 44V106" /><path class="fri-motion" style="--fri-delay:-2s;--fri-scale:.2" d="M270 21V129" /><path class="fri-motion" style="--fri-delay:-2.3s;--fri-scale:.4" d="M282 38V112" /><path class="fri-motion" style="--fri-delay:-2.6s;--fri-scale:.25" d="M294 13V137" /><path class="fri-motion" style="--fri-delay:-2.9s;--fri-scale:.5" d="M306 30V120" /><path class="fri-motion" style="--fri-delay:-3.2s;--fri-scale:.3" d="M318 9V141" /><path class="fri-motion" style="--fri-delay:-3.5s;--fri-scale:.45" d="M330 24V126" /><path class="fri-motion" style="--fri-delay:-3.8s;--fri-scale:.2" d="M342 14V136" /><path class="fri-motion" style="--fri-delay:-.3s;--fri-scale:.5" d="M354 31V119" /><path class="fri-motion" style="--fri-delay:-.6s;--fri-scale:.3" d="M366 25V125" /><path class="fri-motion" style="--fri-delay:-.9s;--fri-scale:.6" d="M378 42V108" /><path class="fri-motion" style="--fri-delay:-1.2s;--fri-scale:.2" d="M390 33V117" /><path class="fri-motion" style="--fri-delay:-1.5s;--fri-scale:.45" d="M402 50V100" /><path class="fri-motion" style="--fri-delay:-1.8s;--fri-scale:.3" d="M414 48V102" /><path class="fri-motion" style="--fri-delay:-2.1s;--fri-scale:.6" d="M426 62V88" /><path class="fri-motion" style="--fri-delay:-2.4s;--fri-scale:.25" d="M438 64V86" />
              </g>
              <path class="fri-motion fri-travel" d="M20 75H640" pathLength="100" stroke="#fff0d7" stroke-width="3" stroke-dasharray="1 99" filter="url(#fri-glow)" />
            
    </g>
    

    <g id="friday-robot" transform="translate(817 344)">
      <ellipse cx="112" cy="211" rx="82" ry="6" fill="#e8ba8c" fill-opacity=".06"/>
      <g class="robot-motion bot-travel">
        <g class="robot-motion bot-hop">
          <g class="robot-motion bot-left-leg"><rect x="86" y="176" width="20" height="28" rx="7" fill="#17130f" stroke="#aa815a" stroke-width="1.5"/><rect x="74" y="197" width="38" height="12" rx="5" fill="#17130f" stroke="#d4a97b" stroke-width="1.5"/></g>
          <g class="robot-motion bot-right-leg"><rect x="129" y="176" width="20" height="28" rx="7" fill="#17130f" stroke="#aa815a" stroke-width="1.5"/><rect x="126" y="197" width="38" height="12" rx="5" fill="#17130f" stroke="#d4a97b" stroke-width="1.5"/></g>
          <rect x="104" y="108" width="23" height="19" rx="5" fill="#1e1812" stroke="#b78e65" stroke-width="1.5"/>
          <rect x="71" y="122" width="91" height="65" rx="17" fill="url(#bot-metal)" stroke="#dfb181" stroke-width="2"/>
          <rect x="89" y="136" width="56" height="33" rx="6" fill="#000000" stroke="#755c43" stroke-width="1.2"/>
          <path d="M100 146L107 152L100 158M114 158H126" fill="none" stroke="#e8ba8c" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
