      </g>
    </g>
    <text class="mono footer" x="42" y="630">Build for failure. Preserve the invariant.</text>
    <text class="mono footer portfolio" x="1078" y="630" text-anchor="end">backendarchitectx.github.io</text>
  </g>
  <rect x=".7" y=".7" width="1118.6" height="648.6" rx="18" fill="none" stroke="#383838" stroke-width="1.4"/>
