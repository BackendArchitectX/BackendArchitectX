name: Render animated 3D EVE README
on:
  push:
    paths:
      - "scripts/render_eve_readme.py"
      - ".github/workflows/build-pawny-gif.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install multilingual fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1 libegl1
      - name: Install 3D renderer and GIF dependencies
        run: python -m pip install 'vtk==9.6.2' 'numpy==2.2.6' 'Pillow==11.3.0'
      - name: Render animated 3D EVE in dark and light themes
        run: python scripts/render_eve_readme.py
      - name: Update only the existing EVE hero image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("README.md")
          before=p.read_text(encoding="utf-8")
          updated=before.replace("eve-readme-v3-","eve-readme-v4-")
          updated=updated.replace(
            "Animated 3D EVE: one-fin wave, then separate pointing gesture; softer 3D finish; five languages",
            "Animated 3D EVE: one moving fin waves and points; other fin stationary; five languages")
          updated=updated.replace(
            "waves hello with only her right fin, then uses her left fin to point toward Pranay Kadu and his engineering work",
            "uses only her screen-left fin to wave hello and then point at Pranay Kadu and his engineering work, while her other fin stays stationary")
          assert updated!=before and updated.count("eve-readme-v4-dark.gif")==1
          assert "eve-readme-v3-" not in updated[:1200]
          p.write_text(updated,encoding="utf-8")
          PY
      - name: Commit README and new EVE assets
        run: |
          git config user.name "BackendArchitectX"
          git config user.email "96111851+BackendArchitectX@users.noreply.github.com"
          git add README.md assets/eve-readme-v4-dark.gif assets/eve-readme-v4-light.gif assets/eve-readme-v4-dark-still.png assets/eve-readme-v4-light-still.png assets/eve-readme-v4-wave.png assets/eve-readme-v4-point.png
          git diff --cached --quiet || git commit -m "fix(profile): animate only one EVE fin for waving and pointing"
          git push origin HEAD:main
