name: Render Pawny five-language GIF
on:
  push:
    paths:
      - 'scripts/render_pawny_gif.py'
      - '.github/workflows/build-pawny-gif.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install fonts for readable Hindi and Mandarin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - name: Install image library
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render GIFs preserving original 3D character
        run: python scripts/render_pawny_gif.py
      - name: Update README to use the new GIFs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          source=p.read_text()
          mapping={
            'spawny-readme-v16-dark-still.png':'pawny-readme-v18-dark-still.png',
            'spawny-readme-v16-light-still.png':'pawny-readme-v18-light-still.png',
            'spawny-readme-v16-dark.gif':'pawny-readme-v18-dark.gif',
            'spawny-readme-v16-light.gif':'pawny-readme-v18-light.gif',
          }
          for old,new in mapping.items():
            assert old in source, old
            source=source.replace(old,new)
          source=source.replace(
            'Original 3D-rendered Pawny GIF restored. Dark/light animations and reduced-motion still images.',
            '3D-rendered Pawny GIF v18: five languages, one at a time, large readable greeting and arrow.')
          source=source.replace(
            'An animated GIF for GitHub README compatibility.',
            'Five languages are displayed one at a time: English, Mandarin Chinese, Hindi, Spanish, and French, six seconds each. Bigger text, brighter glossy red armor, and a large downward arrow. Animated GIF for GitHub README compatibility.')
          p.write_text(source)
          PY
      - name: Commit the regenerated GIFs and README
        run: |
          git config user.name "BackendArchitectX"
          git config user.email "96111851+BackendArchitectX@users.noreply.github.com"
          git add README.md assets/pawny-readme-v18-dark.gif assets/pawny-readme-v18-light.gif assets/pawny-readme-v18-dark-still.png assets/pawny-readme-v18-light-still.png
          git commit -m "feat(profile): ship readable five-language 3D Pawny GIF"
          git push origin HEAD:main
