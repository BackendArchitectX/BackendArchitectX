name: Render animated 3D EVE README
on:
  push:
    paths:
      - "scripts/render_eve_readme.py"
      - ".github/workflows/build-pawny-gif.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install multilingual fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1 libegl1
      - name: Install 3D renderer and GIF dependencies
        run: python -m pip install 'vtk==9.6.2' 'numpy==2.2.6' 'Pillow==11.3.0'
      - name: Render animated 3D EVE in dark and light themes
        run: python scripts/render_eve_readme.py
      - name: Update only the existing EVE hero image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("README.md")
          before=p.read_text(encoding="utf-8")
          updated=before.replace("eve-readme-v1-","eve-readme-v2-")
          updated=updated.replace(
            "Animated 3D EVE: five greetings, one language at a time, dark/light support",
            "Animated 3D EVE: waves hello then points to Pranay Kadu and work; five languages, dark/light support")
          assert updated!=before and updated.count("eve-readme-v2-dark.gif")==1
          assert "eve-readme-v1-" not in updated[:1200]
          p.write_text(updated,encoding="utf-8")
          PY
      - name: Commit README and new EVE assets
        run: |
          git config user.name "BackendArchitectX"
          git config user.email "96111851+BackendArchitectX@users.noreply.github.com"
          git add README.md assets/eve-readme-v2-dark.gif assets/eve-readme-v2-light.gif assets/eve-readme-v2-dark-still.png assets/eve-readme-v2-light-still.png assets/eve-readme-v2-wave.png assets/eve-readme-v2-point.png
          git diff --cached --quiet || git commit -m "feat(profile): animate EVE waving and pointing at Pranay work"
          git push origin HEAD:main
