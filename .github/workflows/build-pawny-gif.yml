name: Render Pawny five-language GIF
on:
  push:
    paths:
      - 'scripts/render_pawny_gif.py'
      - '.github/workflows/build-pawny-gif.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install fonts for readable Hindi and Mandarin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk
      - name: Install image library
        run: python -m pip install 'Pillow==11.3.0'
      - name: Render GIFs preserving original 3D character
        run: python scripts/render_pawny_gif.py
      - name: Update README to use the new GIFs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          source=p.read_text()
          mapping={
            'pawny-readme-v18-dark-still.png':'pawny-readme-v19-dark-still.png',
            'pawny-readme-v18-light-still.png':'pawny-readme-v19-light-still.png',
            'pawny-readme-v18-dark.gif':'pawny-readme-v19-dark.gif',
            'pawny-readme-v18-light.gif':'pawny-readme-v19-light.gif',
          }
          for old,new in mapping.items():
            if old in source:
              source=source.replace(old,new)
            assert new in source,(old,new)
          source=source.replace(
            '3D-rendered Pawny GIF v18: five languages, one at a time, large readable greeting and arrow.',
            '3D-rendered Pawny GIF v19: five languages, one at a time, without overlapping text.')
          source=source.replace(
            'Bigger text, brighter glossy red armor, and a large downward arrow.',
            'Large clear greetings without language labels, a separate footer, bright glossy red armor, and a large downward arrow.')
          p.write_text(source)
          PY
      - name: Commit the regenerated GIFs and README
        run: |
          git config user.name "BackendArchitectX"
          git config user.email "96111851+BackendArchitectX@users.noreply.github.com"
          git add README.md assets/pawny-readme-v19-dark.gif assets/pawny-readme-v19-light.gif assets/pawny-readme-v19-dark-still.png assets/pawny-readme-v19-light-still.png
          git diff --cached --quiet || git commit -m "fix(profile): eliminate Pawny greeting and footer overlaps"
          git push origin HEAD:main
