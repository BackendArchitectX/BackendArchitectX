name: Render animated 3D EVE README
on:
  push:
    branches: [main]
    paths:
      - "scripts/render_eve_readme.py"
      - ".github/workflows/build-pawny-gif.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install multilingual fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1 libegl1
      - name: Install 3D renderer and GIF dependencies
        run: python -m pip install 'vtk==9.6.2' 'numpy==2.2.6' 'Pillow==11.3.0'
      - name: Render animated 3D EVE in dark and light themes
        run: python scripts/render_eve_readme.py
      - name: Update the EVE hero image paths and description
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("README.md")
          before=p.read_text(encoding="utf-8")
          updated=before
          for theme in ("dark", "light"):
              for suffix in (".gif", "-still.png"):
                  old=f"./assets/eve-readme-v6-{theme}{suffix}"
                  new=f"./assets/eve-readme-v7-{theme}{suffix}"
                  assert before.count(old) + before.count(new) == 1, (old, new)
                  assert Path(new).is_file(), new
                  updated=updated.replace(old,new)
          for old, new in (
              ("one moving fin waves and points; other fin stationary", "one hand waves and points down"),
              ("uses only her screen-left fin to wave hello and then point at Pranay Kadu and his engineering work, while her other fin stays stationary", "waves with her right hand and then points down with her index finger as the words ‘Explore Pranay’s work’ appear"),
          ):
              assert before.count(old) + before.count(new) == 1, (old, new)
              updated=updated.replace(old,new)
          if updated!=before:
              p.write_text(updated,encoding="utf-8")
          PY
      - name: Commit README and new EVE assets
        run: |
          git config user.name "BackendArchitectX"
          git config user.email "96111851+BackendArchitectX@users.noreply.github.com"
          git add README.md assets/eve-readme-v7-dark.gif assets/eve-readme-v7-light.gif assets/eve-readme-v7-dark-still.png assets/eve-readme-v7-light-still.png
          git diff --cached --quiet || git commit -m "Update EVE README animation assets"
          git push origin HEAD:main
