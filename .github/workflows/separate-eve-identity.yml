name: Compact highlighted EVE header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/separate_eve_identity.py'
      - '.github/workflows/separate-eve-identity.yml'
      - 'assets/eve-identity-v2-*.svg'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: separate-eve-identity
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG and GIF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core libcairo2
          python -m pip install Pillow==11.3.0 CairoSVG==2.7.1
      - name: Compose compact header and validate animation
        run: python scripts/separate_eve_identity.py
      - name: Publish verified assets and README together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/eve-readme-v15-compact-dark.gif assets/eve-readme-v15-compact-light.gif assets/eve-readme-v15-compact-dark-still.png assets/eve-readme-v15-compact-light-still.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: restore compact EVE header with navy highlights"
          git push origin HEAD:main
