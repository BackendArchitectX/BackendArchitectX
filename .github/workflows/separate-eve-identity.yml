name: Separate EVE identity and animation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/separate_eve_identity.py'
      - '.github/workflows/separate-eve-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: separate-eve-identity
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Separate identity and validate animation durations
        run: python scripts/separate_eve_identity.py
      - name: Publish verified assets and README together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/eve-readme-v14-separated-dark.gif assets/eve-readme-v14-separated-light.gif assets/eve-readme-v14-separated-dark-still.png assets/eve-readme-v14-separated-light-still.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish separated highlighted EVE identity"
          git push origin HEAD:main
