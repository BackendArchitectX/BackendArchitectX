name: Align red EVE with native header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_eve_robot.py'
      - '.github/workflows/separate-eve-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: separate-eve-identity
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install GIF dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Extract robot and validate motion
        run: |
          python -m py_compile scripts/extract_eve_robot.py
          python scripts/extract_eve_robot.py
      - name: Publish robot-only assets and native README text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/eve-robot-v19-upper-red-dark.gif assets/eve-robot-v19-upper-red-light.gif assets/eve-robot-v19-upper-red-dark-still.png assets/eve-robot-v19-upper-red-light-still.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish tightly aligned red EVE animation"
          git push origin HEAD:main
