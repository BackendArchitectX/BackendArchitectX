name: Render smooth full-color EVE animation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_eve_robot.py'
      - 'scripts/render_eve_red.py'
      - '.github/workflows/separate-eve-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: separate-eve-identity
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install 3D rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1 libegl1
          python -m pip install vtk==9.6.2 numpy==2.2.6 Pillow==11.3.0
      - name: Compose multilingual greeting and validate pointing cue
        run: |
          python -m py_compile scripts/extract_eve_robot.py scripts/render_eve_red.py
          python scripts/extract_eve_robot.py
      - name: Publish robot-only assets and native README text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/eve-robot-v23-smooth-red-dark.webp assets/eve-robot-v23-smooth-red-light.webp assets/eve-robot-v23-smooth-red-dark-still.png assets/eve-robot-v23-smooth-red-light-still.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish lossless full-color EVE animation"
          git push origin HEAD:main
