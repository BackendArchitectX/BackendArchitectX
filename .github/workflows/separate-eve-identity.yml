name: Render Crimson and Titanium EVE header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_eve_red.py'
      - '.github/workflows/separate-eve-identity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: separate-eve-identity
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install multilingual fonts and renderer libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-dejavu-core libgl1 libegl1
          python -m pip install 'vtk==9.6.2' 'numpy==2.2.6' 'Pillow==11.3.0'
      - name: Render and validate the red 3D animation
        run: |
          python -m py_compile scripts/render_eve_red.py
          python scripts/render_eve_red.py
      - name: Switch README to the compact verified assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("README.md")
          before = p.read_text(encoding="utf-8")
          updated = re.sub(r'(?m)^<p><picture><source media="\(prefers-color-scheme: dark\)" srcset="\./assets/eve-identity-v1-dark\.svg"[^\n]*</picture></p>\n\n', '', before)
          assert "eve-identity-v1-dark.svg" not in updated
          for theme in ("dark", "light"):
              for suffix in (".gif", "-still.png"):
                  new = f"./assets/eve-readme-v17-crimson-titanium-{theme}{suffix}"
                  old = [f"./assets/eve-readme-{version}-{theme}{suffix}" for version in ("v13", "v14-separated", "v15-compact", "v16-red")]
                  assert sum(updated.count(x) for x in old+[new]) == 1
                  assert Path(new).is_file()
                  for x in old:
                      updated = updated.replace(x,new)
          p.write_text(updated,encoding="utf-8")
          PY
      - name: Publish validated animation and README atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/eve-readme-v17-crimson-titanium-dark.gif assets/eve-readme-v17-crimson-titanium-light.gif assets/eve-readme-v17-crimson-titanium-dark-still.png assets/eve-readme-v17-crimson-titanium-light-still.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: publish crimson and titanium EVE header"
          git push origin HEAD:main
